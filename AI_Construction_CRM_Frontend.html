<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Intelligence — AI Construction CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0c2033;
    --blue-panel:#0f2c44;
    --grid-line:rgba(122,178,204,0.10);
    --grid-line-strong:rgba(122,178,204,0.22);
    --cyan:#7fb8d6;
    --cyan-bright:#a9d4ea;
    --paper:#f4f0e4;
    --paper-dim:#e9e3d2;
    --ink:#132133;
    --ink-soft:#4d5c6b;
    --orange:#ff6a3d;
    --orange-dim:#e0572a;
    --green:#4f9d78;
    --amber:#d99a35;
    --red:#d1493f;
    --sidebar-w:224px;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  #loginScreen {
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  background: #0f1419;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: #182027;
  border: 1px solid #2b3943;
  border-radius: 12px;
  padding: 36px;
  box-sizing: border-box;
}

.login-brand {
  margin-bottom: 30px;
}

.login-card h1 {
  margin: 0 0 8px;
}

.login-card p {
  margin: 0 0 28px;
  opacity: .7;
}

.login-card label {
  display: block;
  margin: 16px 0 7px;
}

.login-card input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #394852;
  background: #10171c;
  color: inherit;
}

.login-card button {
  width: 100%;
  margin-top: 24px;
}

#loginError {
  margin-top: 16px;
  padding: 10px;
  border-radius: 6px;
  background: rgba(220, 70, 70, .12);
}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--blue-deep);
    color:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:28px 28px;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--orange); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--grid-line-strong); border-radius:5px;}

  a, button{font-family:inherit;}

  /* ---------- layout shell ---------- */
  #app{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--blue-panel);
    border-right:1px solid var(--grid-line-strong);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--grid-line-strong);
  }
  .brand-mark{
    display:flex; align-items:center; gap:9px;
  }
  .brand-mark svg{flex:0 0 auto;}
  .brand-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.02em;
    line-height:1.2;
    color:var(--paper);
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-top:5px;
  }
  nav#modnav{flex:1; overflow-y:auto; padding:14px 0;}
  .nav-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:14px 20px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:8px 20px;
    background:none; border:none;
    color:var(--cyan);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.01em;
    text-align:left;
    cursor:pointer;
    border-left:2px solid transparent;
    position:relative;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.85;}
  .nav-item:hover{background:rgba(122,178,204,0.06); color:var(--paper);}
  .nav-item.active{
    color:var(--paper);
    background:rgba(255,106,61,0.09);
    border-left-color:var(--orange);
  }
  .nav-item .count{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
  }
  .sidebar-foot{
    padding:14px 20px 18px;
    border-top:1px solid var(--grid-line-strong);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .sidebar-foot .dot{color:var(--green); margin-right:6px;}

  /* ---------- main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    height:60px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    border-bottom:1px solid var(--grid-line-strong);
    background:rgba(12,32,51,0.85);
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-title{font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600;}
  .topbar-breadcrumb{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .tenant-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--cyan);
    border:1px solid var(--grid-line-strong);
    padding:6px 10px;
    border-radius:var(--radius);
    letter-spacing:.03em;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:var(--radius);
    border:1px solid var(--grid-line-strong);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan-bright);}
  .btn-primary{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--orange-dim); border-color:var(--orange-dim); color:#fff;}
  .btn-sm{padding:5px 10px; font-size:10px;}
  .btn-ghost-danger{border-color:transparent; color:var(--red);}
  .btn-ghost-danger:hover{border-color:var(--red); color:var(--red);}

  #content{flex:1; padding:26px 30px 60px;}

  /* ---------- blueprint paper panel (signature element) ---------- */
  .sheet{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:0 12px 28px -14px rgba(0,0,0,0.45);
  }
  .sheet::before, .sheet::after,
  .sheet .cmk1, .sheet .cmk2{
    content:''; position:absolute; width:11px; height:11px;
    border-color:var(--orange); pointer-events:none;
  }
  .sheet::before{top:6px; left:6px; border-top:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet::after{top:6px; right:6px; border-top:2px solid var(--orange); border-right:2px solid var(--orange);}
  .sheet .cmk1{bottom:6px; left:6px; border-bottom:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet .cmk2{bottom:6px; right:6px; border-bottom:2px solid var(--orange); border-right:2px solid var(--orange);}

  .sheet-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange-dim);
    margin-bottom:4px;
  }
  .sheet-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .sheet-title .sub{
    font-family:'Inter';
    font-size:12px; font-weight:500;
    color:var(--ink-soft);
  }

  /* ---------- grid helpers ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

  /* ---------- KPI cards ---------- */
  .kpi{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .kpi-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--cyan);
  }
  .kpi-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px; font-weight:700;
    margin-top:8px;
  }
  .kpi-delta{font-size:11px; margin-top:6px; color:var(--ink-soft);}
  .kpi-delta.up{color:var(--green);}
  .kpi-delta.down{color:var(--red);}

  /* ---------- AI cards ---------- */
  .ai-card{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-left:3px solid var(--cyan);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .ai-card.risk-high{border-left-color:var(--red);}
  .ai-card.risk-med{border-left-color:var(--amber);}
  .ai-card.risk-low{border-left-color:var(--green);}
  .ai-card-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .ai-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--orange);
    border:1px solid rgba(255,106,61,0.4);
    padding:2px 6px; border-radius:2px;
  }
  .ai-card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  font-weight:600;
  color:#ffffff;
  margin-bottom:8px;
}
  .ai-card-body{font-size:12px; color:#cdd8e0; line-height:1.5;}
  .ai-card-body b{color:#fff;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:1.5px solid var(--paper-dim);
  }
  tbody td{
    padding:10px 10px;
    border-bottom:1px solid var(--paper-dim);
    color:var(--ink);
    vertical-align:middle;
  }
  tbody tr:hover{background:rgba(255,106,61,0.05);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-mono{font-family:'IBM Plex Mono', monospace; font-size:11.5px;}

  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
    display:inline-block;
  }
  .badge-green{background:rgba(79,157,120,0.15); color:#2f7752;}
  .badge-amber{background:rgba(217,154,53,0.18); color:#9c6c1c;}
  .badge-red{background:rgba(209,73,63,0.15); color:#a83329;}
  .badge-blue{background:rgba(122,178,204,0.18); color:#2a6f8f;}
  .badge-gray{background:rgba(77,92,107,0.14); color:#4d5c6b;}

  .progress-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:6px; overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--orange); border-radius:6px;}
  .progress-fill.green{background:var(--green);}
  .progress-fill.red{background:var(--red);}

  /* ---------- forms / modal ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    color:var(--paper);
    padding:8px 12px;
    border-radius:var(--radius);
    min-width:200px;
  }
  .search-input::placeholder{color:var(--ink-soft);}

  #modal-backdrop{
    position:fixed; inset:0; background:rgba(6,16,26,0.72);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  #modal-backdrop.open{display:flex;}
  #modal{
    background:var(--paper); color:var(--ink);
    width:100%; max-width:480px;
    border-radius:var(--radius);
    padding:24px;
    position:relative;
    max-height:88vh; overflow-y:auto;
  }
  #modal .sheet-title{margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px;
    border:1px solid var(--paper-dim);
    background:#fff;
    border-radius:2px;
    font-size:13px; font-family:inherit; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .modal-close{
    position:absolute; top:16px; right:18px;
    background:none; border:none; cursor:pointer;
    font-size:18px; color:var(--ink-soft); line-height:1;
  }

  /* ---------- misc ---------- */
  .empty{
    text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:12.5px;
  }
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .muted{color:var(--ink-soft);}
  .section-gap{margin-top:22px;}
  .chart-wrap{width:100%; overflow-x:auto;}
  .mini-note{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft);
    margin-top:10px; letter-spacing:.02em;
  }
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
  .avatar-dot{
    width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;
  }
  .toast{
    position:fixed; bottom:20px; right:20px;
    background:var(--blue-panel); border:1px solid var(--cyan);
    color:var(--paper); padding:11px 16px; border-radius:2px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
    z-index:200; opacity:0; transform:translateY(6px);
    transition:all .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>
<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-title">Site Intelligence</div>
      <div class="brand-sub">AI Construction CRM</div>
    </div>

    <h1>Welcome back</h1>
    <p>Sign in to access your construction dashboard.</p>

    <form id="loginForm">
      <label>Username</label>
      <input
        type="text"
        id="loginUsername"
        placeholder="Enter username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
        required
      >

      <div id="loginError" style="display:none;"></div>

      <button type="submit" class="btn primary">
        Login
      </button>
    </form>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect x="1" y="1" width="24" height="24" stroke="#ff6a3d" stroke-width="1.4"/>
          <path d="M6 20V10L13 5L20 10V20" stroke="#7fb8d6" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M10 20V14H16V20" stroke="#7fb8d6" stroke-width="1.4"/>
        </svg>
        <div>
          <div class="brand-title">Site Intelligence</div>
          <div class="brand-sub">AI Construction CRM</div>
        </div>
      </div>
    </div>
    <nav id="modnav">
      <div class="nav-group-label">Overview</div>
      <button class="nav-item active" data-view="dashboard">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" stroke="currentColor"/><rect x="8" y="1" width="5" height="5" stroke="currentColor"/><rect x="1" y="8" width="5" height="5" stroke="currentColor"/><rect x="8" y="8" width="5" height="5" stroke="currentColor"/></svg>
        Dashboard
      </button>

      <div class="nav-group-label">Relationships</div>
      <button class="nav-item" data-view="clients">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="4.5" r="2.2" stroke="currentColor"/><path d="M1 13c0-2.5 1.8-4 4-4s4 1.5 4 4" stroke="currentColor"/><path d="M9 5.2a2 2 0 110 3.8" stroke="currentColor"/><path d="M9.5 9c2 0 3.5 1.4 3.5 4" stroke="currentColor"/></svg>
        Clients <span class="count" id="nc-clients"></span>
      </button>
      <button class="nav-item" data-view="contractors">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 12l3-3 2 2 5-5" stroke="currentColor"/><path d="M9 5h3v3" stroke="currentColor"/></svg>
        Contractors <span class="count" id="nc-contractors"></span>
      </button>

      <div class="nav-group-label">Execution</div>
      <button class="nav-item" data-view="projects">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" stroke="currentColor"/><path d="M1 5.5h12" stroke="currentColor"/></svg>
        Projects <span class="count" id="nc-projects"></span>
      </button>
      <button class="nav-item" data-view="sites">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L1 12h12L7 1z" stroke="currentColor" stroke-linejoin="round"/><path d="M7 5v4" stroke="currentColor"/></svg>
        Sites <span class="count" id="nc-sites"></span>
      </button>
      <button class="nav-item" data-view="progress">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 8l3 3 8-8" stroke="currentColor"/></svg>
        Daily Progress <span class="count" id="nc-progress"></span>
      </button>

      <div class="nav-group-label">Resources</div>
      <button class="nav-item" data-view="materials">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="4" width="12" height="8" stroke="currentColor"/><path d="M1 4l6-3 6 3" stroke="currentColor"/></svg>
        Material Stock <span class="count" id="nc-materials"></span>
      </button>
      <button class="nav-item" data-view="labour">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4" r="2" stroke="currentColor"/><path d="M2.5 12c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor"/></svg>
        Labour <span class="count" id="nc-labour"></span>
      </button>
      <button class="nav-item" data-view="equipment">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 12l4-4M9 2l3 3-6.5 6.5L2 8 9 2z" stroke="currentColor" stroke-linejoin="round"/></svg>
        Equipment <span class="count" id="nc-equipment"></span>
      </button>

      <div class="nav-group-label">Finance</div>
      <button class="nav-item" data-view="billing">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" stroke="currentColor"/><path d="M4 6h6M4 8.5h4" stroke="currentColor"/></svg>
        Billing <span class="count" id="nc-billing"></span>
      </button>
      <button class="nav-item" data-view="payments">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="8" stroke="currentColor"/><circle cx="7" cy="7" r="1.6" stroke="currentColor"/></svg>
        Payments <span class="count" id="nc-payments"></span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <span class="dot">●</span>ALL SYSTEMS NOMINAL<br>
      <span style="opacity:.6">v1.0 · MULTI-TENANT DEMO</span>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <div>
          <div class="topbar-title" id="topbar-title">Dashboard</div>
          <div class="topbar-breadcrumb" id="topbar-crumb">Portfolio Overview</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="tenant-chip">⌂ Ashoka Builders &amp; Co.</span>
        <button class="btn" id="btn-refresh-ai">↻ Refresh AI</button>
        <button class="btn btn-primary" id="btn-quick-add">+ New</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-backdrop">

  console.log('LOGIN SUCCESS');

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('refresh_token');

  if (!refreshToken) {
    throw new Error('NO_REFRESH_TOKEN');
  }

  const response = await fetch(`${API_BASE}/refresh/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      refresh: refreshToken
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(`REFRESH ${response.status}: ${JSON.stringify(data)}`);
  }

  localStorage.setItem('access_token', data.access);

  accessToken = data.access;

  console.log('ACCESS TOKEN REFRESHED');

  return data.access;
}


async function apiFetch(endpoint, options = {}) {
  let token = localStorage.getItem('access_token') || '';

  console.log('USING TOKEN:', token ? 'YES' : 'NO');

  let response = await fetch(`${API_BASE}${endpoint}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {}),
      'Authorization': `Bearer ${token}`
    }
  });

  // Access token expired
  if (response.status === 401) {
    console.log('ACCESS TOKEN EXPIRED — TRYING REFRESH');

    try {
      token = await refreshAccessToken();

      // Retry the original request with the new token
      response = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
          'Authorization': `Bearer ${token}`
        }
      });

    } catch (refreshError) {
      console.error('REFRESH FAILED:', refreshError);

      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');

      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';

      throw new Error('SESSION_EXPIRED');
    }
  }

  if (!response.ok) {
    const text = await response.text();
    throw new Error(`API ${response.status}: ${text}`);
  }

  return await response.json();
}

const AI = {

  completion(p) {
    const elapsed = daysBetween(p.start, todayISO());
    const totalPlanned = daysBetween(p.start, p.target);
    const rate = p.progress / Math.max(elapsed, 1);

    const daysNeeded =
      rate > 0
        ? Math.round((100 - p.progress) / rate)
        : 999;

    const projected =
      new Date(Date.now() + daysNeeded * 86400000);

    const delayDays =
      daysBetween(
        p.target,
        projected.toISOString().slice(0, 10)
      );

    return {
      projected,
      delayDays,
      totalPlanned,
      elapsed
    };
  },

  costOverrun(p) {
    const spendRatio = p.spend / p.budget;
    const progressRatio = p.progress / 100;

    const drift =
      progressRatio > 0
        ? (spendRatio - progressRatio) / progressRatio
        : 0;

    const projectedFinalCost =
      p.budget * (1 + Math.max(drift, 0));

    return {
      spendRatio,
      progressRatio,
      drift,
      projectedFinalCost
    };
  },

  riskLevel(p) {
    const c = AI.completion(p);
    const co = AI.costOverrun(p);

    if (c.delayDays > 20 || co.drift > 0.18) {
      return 'high';
    }

    if (c.delayDays > 5 || co.drift > 0.07) {
      return 'med';
    }

    return 'low';
  },

  materialAlerts() {
    return state.materials.filter(
      m => m.qty <= m.threshold
    );
  },

  labourForecast(site) {
    const l =
      state.labour.filter(
        x => x.site === site
      );

    const avgAtt =
      l.length
        ? l.reduce(
            (s, x) => s + x.attendance / x.days,
            0
          ) / l.length
        : 0;

    const shortfall = avgAtt < 0.85;

    return {
      count: l.length,
      avgAtt,
      shortfall
    };
  },

  safetyRisk(site) {
    const logs =
      state.progress.filter(
        x => x.site === site
      );

    const keywords = [
      'unsafe',
      'hazard',
      'accident',
      'fall',
      'unguarded',
      'loose',
      'seepage',
      'near-miss',
      'injur'
    ];

    const flagged =
      logs.filter(l =>
        keywords.some(k =>
          l.issues.toLowerCase().includes(k)
        )
      );

    return {
      flagged,
      level:
        flagged.length >= 2
          ? 'high'
          : flagged.length === 1
            ? 'med'
            : 'low'
    };
  },

  generateReportFromDPR(projectName, dprLogs) {

    if (!dprLogs.length) {
      return 'No progress data available for this project yet.';
    }

    const logs = dprLogs
      .slice()
      .sort(
        (a, b) =>
          new Date(b.report_date) -
          new Date(a.report_date)
      );

    const latest = logs[0];

    const previous =
      logs.length > 1
        ? logs[1]
        : null;

    let out =
      `As of ${fmtDate(latest.report_date)}, ` +
      `${projectName} reports: ` +
      `${latest.work_done || 'No activity description available.'} `;

    out +=
      `Current reported progress is ` +
      `${latest.progress_percentage ?? 0}% ` +
      `with ${latest.workers_present ?? 0} workers present. `;

    if (latest.weather) {
      out += `Weather was ${latest.weather}. `;
    }

    const remarks = latest.remarks || '';

    const safetyKeywords = [
      'unsafe',
      'hazard',
      'accident',
      'fall',
      'unguarded',
      'loose',
      'seepage',
      'near-miss',
      'injur'
    ];

    const safetyFlagged =
      safetyKeywords.some(k =>
        remarks.toLowerCase().includes(k)
      );

    if (safetyFlagged) {
      out +=
        'Safety attention is required based on the latest site remarks. ';
    } else {
      out +=
        'No active safety issue was identified in the latest remarks. ';
    }

    if (previous) {

      const change =
        (latest.progress_percentage ?? 0) -
        (previous.progress_percentage ?? 0);

      if (change > 0) {

        out +=
          `Progress increased by ${change} percentage points ` +
          `from the previous DPR.`;

      } else if (change < 0) {

        out +=
          `Reported progress is ${Math.abs(change)} percentage points ` +
          `below the previous DPR.`;

      } else {

        out +=
          'Reported progress is unchanged from the previous DPR.';
      }

    } else {

      out +=
        'This is the first available DPR for this project.';
    }

    return out;
  }

};

  s.className = 'sheet';
  s.innerHTML = `<div class="cmk1"></div><div class="cmk2"></div>
    <div class="sheet-label">${labelText}</div>
    <div class="sheet-title"><span>${titleText}</span>${subText?`<span class="sub">${subText}</span>`:''}</div>`;

async function loadProjectRisk(projectId, card) {
  try {
    const result = await apiFetch(`/ai/project-risk/${projectId}/`);

    const risk = (result.overall_risk || 'LOW').toLowerCase();

    card.classList.remove('risk-low', 'risk-med', 'risk-high');

    const riskClass = risk === 'medium' ? 'med' : risk;
    card.classList.add(`risk-${riskClass}`);

    const riskElement = card.querySelector('.backend-risk-level');

    if (riskElement) {
      riskElement.textContent = risk;
    }
  } catch (error) {
    console.error(`Project risk API error for project ${projectId}:`, error);
  }
}

async function deleteBackendContractor(id) {
  const token = localStorage.getItem('access_token') || '';

  const response = await fetch(`${API_BASE}/contractors/${id}/`, {
    method: 'DELETE',
    headers: {
      'Authorization': `Bearer ${token}`
    }
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(`DELETE CONTRACTOR ${response.status}: ${text}`);
  }

  return true;
}

async function renderProgress() {
  const backendDPR = await getBackendDPR();

  const s = sheet(
    'Site Operations',
    'Daily Progress Logs',
    `${backendDPR.length} entries`
  );

  const list = document.createElement('div');

  backendDPR
    .slice()
    .sort((a, b) =>
      new Date(b.report_date) - new Date(a.report_date)
    )
    .forEach(log => {

      const row = document.createElement('div');

      row.style.cssText =
        'padding:12px 0; border-bottom:1px solid var(--paper-dim);';

      const remarks = log.remarks || '';
      const activity = log.work_done || '—';

      const flagged = [
        'unsafe',
        'hazard',
        'accident',
        'fall',
        'unguarded',
        'loose',
        'seepage',
        'near-miss',
        'injur'
      ].some(k =>
        remarks.toLowerCase().includes(k)
      );

      row.innerHTML = `
        <div class="flex-between">

          <div>
            <b>
              DPR #${log.id}
            </b>

            <span
              class="muted cell-mono"
              style="font-size:11px;"
            >
              · ${fmtDate(log.report_date)}
            </span>
          </div>

          ${
            flagged
              ? '<span class="badge badge-red">Safety Flag</span>'
              : '<span class="badge badge-green">Normal</span>'
          }

        </div>

        <div style="margin-top:6px; font-size:13px;">
          ${activity}
        </div>

        <div
          class="muted"
          style="margin-top:5px; font-size:12px;"
        >
          Progress:
          <b>${log.progress_percentage ?? 0}%</b>
          &nbsp; · &nbsp;

          Workers:
          <b>${log.workers_present ?? 0}</b>
          &nbsp; · &nbsp;

          Weather:
          <b>${log.weather || '—'}</b>
        </div>

        <div
          class="muted"
          style="margin-top:3px; font-size:12px;"
        >
          Remarks:
          ${remarks || '—'}
        </div>
      `;

      list.appendChild(row);
    });

  if (!backendDPR.length) {
    list.innerHTML = `
      <div class="muted" style="padding:20px 0;">
        No Daily Progress Reports found in Django.
      </div>
    `;
  }

  s.appendChild(list);
  els.content.appendChild(s);


    /* ================================
     AI PROGRESS REPORTS
  ================================= */

  const repSheet = sheet(
    'AI Generative',
    'AI Progress Report Generator',
    'Auto-summarised from latest site logs'
  );

  const repGrid = document.createElement('div');
  repGrid.className = 'grid grid-3';

  const projectGroups = {};

  backendDPR.forEach(log => {
    const projectName =
      log.project_name || 'Unknown Project';

    if (!projectGroups[projectName]) {
      projectGroups[projectName] = [];
    }

    projectGroups[projectName].push(log);
  });

  Object.entries(projectGroups).forEach(
    ([projectName, logs]) => {

      const div = document.createElement('div');

      div.className = 'ai-card risk-low';

      div.innerHTML = `
        <div class="ai-card-head">
          <span class="ai-tag">AI DPR REPORT</span>
        </div>

        <div class="ai-card-title">
          ${projectName}
        </div>

        <div
          class="ai-card-body"
          style="margin-top:6px;"
        >
          ${AI.generateReportFromDPR(projectName, logs)}
        </div>
      `;

      repGrid.appendChild(div);
    }
  );

  repSheet.appendChild(repGrid);
  els.content.appendChild(repSheet);
}

/* =======================================================
   SHARED: modal, empty state, delete
======================================================= */
function emptyEl(msg){ const d=document.createElement('div'); d.className='empty'; d.textContent=msg; return d; }

function removeItem(key, id){
  state[key] = state[key].filter(x=>x.id!==id);
  toast('Removed');
  render();
}

function openModal(title, fields, onSubmit){
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="modal-close" id="modal-close">✕</button>
    <div class="sheet-title">${title}</div>
    <form id="modal-form">
      ${fields.map(f=>`
        <div class="field">
          <label>${f.label}${f.req?' *':''}</label>
          ${f.type==='select' ? `<select name="${f.k}" ${f.req?'required':''}>
              <option value="">Select…</option>
              ${(f.options||[]).map(o => {
  if (typeof o === 'object') {
    return `<option value="${o.value}">${o.label}</option>`;
  }
  return `<option value="${o}">${o}</option>`;
}).join('')}
            </select>`
          : f.type==='textarea' ? `<textarea name="${f.k}" ${f.req?'required':''}></textarea>`
          : `<input type="${f.type}" name="${f.k}" ${f.req?'required':''}>`}
        </div>`).join('')}
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  `;
  backdrop.classList.add('open');
  const close = ()=> backdrop.classList.remove('open');
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  backdrop.onclick = e => { if(e.target===backdrop) close(); };
  document.getElementById('modal-form').onsubmit = e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fields.forEach(f=> data[f.k] = fd.get(f.k));
    onSubmit(data);
    close();
  };
}
