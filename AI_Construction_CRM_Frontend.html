<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Intelligence — AI Construction CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0c2033;
    --blue-panel:#0f2c44;
    --grid-line:rgba(122,178,204,0.10);
    --grid-line-strong:rgba(122,178,204,0.22);
    --cyan:#7fb8d6;
    --cyan-bright:#a9d4ea;
    --paper:#f4f0e4;
    --paper-dim:#e9e3d2;
    --ink:#132133;
    --ink-soft:#4d5c6b;
    --orange:#ff6a3d;
    --orange-dim:#e0572a;
    --green:#4f9d78;
    --amber:#d99a35;
    --red:#d1493f;
    --sidebar-w:224px;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--blue-deep);
    color:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:28px 28px;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--orange); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--grid-line-strong); border-radius:5px;}

  a, button{font-family:inherit;}

  /* ---------- layout shell ---------- */
  #app{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--blue-panel);
    border-right:1px solid var(--grid-line-strong);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--grid-line-strong);
  }
  .brand-mark{
    display:flex; align-items:center; gap:9px;
  }
  .brand-mark svg{flex:0 0 auto;}
  .brand-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.02em;
    line-height:1.2;
    color:var(--paper);
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-top:5px;
  }
  nav#modnav{flex:1; overflow-y:auto; padding:14px 0;}
  .nav-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:14px 20px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:8px 20px;
    background:none; border:none;
    color:var(--cyan);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.01em;
    text-align:left;
    cursor:pointer;
    border-left:2px solid transparent;
    position:relative;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.85;}
  .nav-item:hover{background:rgba(122,178,204,0.06); color:var(--paper);}
  .nav-item.active{
    color:var(--paper);
    background:rgba(255,106,61,0.09);
    border-left-color:var(--orange);
  }
  .nav-item .count{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
  }
  .sidebar-foot{
    padding:14px 20px 18px;
    border-top:1px solid var(--grid-line-strong);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .sidebar-foot .dot{color:var(--green); margin-right:6px;}

  /* ---------- main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    height:60px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    border-bottom:1px solid var(--grid-line-strong);
    background:rgba(12,32,51,0.85);
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-title{font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600;}
  .topbar-breadcrumb{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .tenant-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--cyan);
    border:1px solid var(--grid-line-strong);
    padding:6px 10px;
    border-radius:var(--radius);
    letter-spacing:.03em;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:var(--radius);
    border:1px solid var(--grid-line-strong);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan-bright);}
  .btn-primary{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--orange-dim); border-color:var(--orange-dim); color:#fff;}
  .btn-sm{padding:5px 10px; font-size:10px;}
  .btn-ghost-danger{border-color:transparent; color:var(--red);}
  .btn-ghost-danger:hover{border-color:var(--red); color:var(--red);}

  #content{flex:1; padding:26px 30px 60px;}

  /* ---------- blueprint paper panel (signature element) ---------- */
  .sheet{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:0 12px 28px -14px rgba(0,0,0,0.45);
  }
  .sheet::before, .sheet::after,
  .sheet .cmk1, .sheet .cmk2{
    content:''; position:absolute; width:11px; height:11px;
    border-color:var(--orange); pointer-events:none;
  }
  .sheet::before{top:6px; left:6px; border-top:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet::after{top:6px; right:6px; border-top:2px solid var(--orange); border-right:2px solid var(--orange);}
  .sheet .cmk1{bottom:6px; left:6px; border-bottom:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet .cmk2{bottom:6px; right:6px; border-bottom:2px solid var(--orange); border-right:2px solid var(--orange);}

  .sheet-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange-dim);
    margin-bottom:4px;
  }
  .sheet-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .sheet-title .sub{
    font-family:'Inter';
    font-size:12px; font-weight:500;
    color:var(--ink-soft);
  }

  /* ---------- grid helpers ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

  /* ---------- KPI cards ---------- */
  .kpi{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .kpi-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--cyan);
  }
  .kpi-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px; font-weight:700;
    margin-top:8px;
  }
  .kpi-delta{font-size:11px; margin-top:6px; color:var(--ink-soft);}
  .kpi-delta.up{color:var(--green);}
  .kpi-delta.down{color:var(--red);}

  /* ---------- AI cards ---------- */
  .ai-card{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-left:3px solid var(--cyan);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .ai-card.risk-high{border-left-color:var(--red);}
  .ai-card.risk-med{border-left-color:var(--amber);}
  .ai-card.risk-low{border-left-color:var(--green);}
  .ai-card-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .ai-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--orange);
    border:1px solid rgba(255,106,61,0.4);
    padding:2px 6px; border-radius:2px;
  }
  .ai-card-title{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;}
  .ai-card-body{font-size:12px; color:#cdd8e0; line-height:1.5;}
  .ai-card-body b{color:#fff;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:1.5px solid var(--paper-dim);
  }
  tbody td{
    padding:10px 10px;
    border-bottom:1px solid var(--paper-dim);
    color:var(--ink);
    vertical-align:middle;
  }
  tbody tr:hover{background:rgba(255,106,61,0.05);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-mono{font-family:'IBM Plex Mono', monospace; font-size:11.5px;}

  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
    display:inline-block;
  }
  .badge-green{background:rgba(79,157,120,0.15); color:#2f7752;}
  .badge-amber{background:rgba(217,154,53,0.18); color:#9c6c1c;}
  .badge-red{background:rgba(209,73,63,0.15); color:#a83329;}
  .badge-blue{background:rgba(122,178,204,0.18); color:#2a6f8f;}
  .badge-gray{background:rgba(77,92,107,0.14); color:#4d5c6b;}

  .progress-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:6px; overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--orange); border-radius:6px;}
  .progress-fill.green{background:var(--green);}
  .progress-fill.red{background:var(--red);}

  /* ---------- forms / modal ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    color:var(--paper);
    padding:8px 12px;
    border-radius:var(--radius);
    min-width:200px;
  }
  .search-input::placeholder{color:var(--ink-soft);}

  #modal-backdrop{
    position:fixed; inset:0; background:rgba(6,16,26,0.72);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  #modal-backdrop.open{display:flex;}
  #modal{
    background:var(--paper); color:var(--ink);
    width:100%; max-width:480px;
    border-radius:var(--radius);
    padding:24px;
    position:relative;
    max-height:88vh; overflow-y:auto;
  }
  #modal .sheet-title{margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px;
    border:1px solid var(--paper-dim);
    background:#fff;
    border-radius:2px;
    font-size:13px; font-family:inherit; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .modal-close{
    position:absolute; top:16px; right:18px;
    background:none; border:none; cursor:pointer;
    font-size:18px; color:var(--ink-soft); line-height:1;
  }

  /* ---------- misc ---------- */
  .empty{
    text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:12.5px;
  }
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .muted{color:var(--ink-soft);}
  .section-gap{margin-top:22px;}
  .chart-wrap{width:100%; overflow-x:auto;}
  .mini-note{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft);
    margin-top:10px; letter-spacing:.02em;
  }
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
  .avatar-dot{
    width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;
  }
  .toast{
    position:fixed; bottom:20px; right:20px;
    background:var(--blue-panel); border:1px solid var(--cyan);
    color:var(--paper); padding:11px 16px; border-radius:2px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
    z-index:200; opacity:0; transform:translateY(6px);
    transition:all .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">

      <div class="nav-group-label">Resources</div>
      <button class="nav-item" data-view="materials">

        Material Stock <span class="count" id="nc-materials"></span>
      </button>
      <button class="nav-item" data-view="labour">

        Labour <span class="count" id="nc-labour"></span>
      </button>
      <button class="nav-item" data-view="equipment">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 12l4-4M9 2l3 3-6.5 6.5L2 8 9 2z" stroke="currentColor" stroke-linejoin="round"/></svg>

      <div class="nav-group-label">Finance</div>

      <button class="nav-item" data-view="payments">

    </nav>
    <div class="sidebar-foot">
      <span class="dot">●</span>ALL SYSTEMS NOMINAL<br>
      <span style="opacity:.6">v1.0 · MULTI-TENANT DEMO</span>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <div>
          <div class="topbar-title" id="topbar-title">Dashboard</div>
          <div class="topbar-breadcrumb" id="topbar-crumb">Portfolio Overview</div>

      <div class="topbar-right">
        <span class="tenant-chip">⌂ Ashoka Builders &amp; Co.</span>
        <button class="btn" id="btn-refresh-ai">↻ Refresh AI</button>

    <div id="content"></div>

<div id="modal-backdrop">

<script>
/* =======================================================

======================================================= */
const uid = (() => { let n = 1000; return () => 'ID-' + (n++); })();
const API_BASE = 'http://127.0.0.1:8001/api';
let accessToken = localStorage.getItem('access_token') || '';
async function apiFetch(endpoint) {
  const response = await fetch(`${API_BASE}${endpoint}`, {
    method: 'GET',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${accessToken}`
    }
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(`API ${response.status}: ${text}`);
  }

  return await response.json();
}
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = n => '₹' + Number(n).toLocaleString('en-IN');
const fmtDate = d => new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

    {id:uid(), name:'Nashik Municipal Corp — Housing Wing', contact:'Er. Meena Kulkarni', phone:'+91 98500 44210', email:'meena.k@nmc.gov.in', address:'Rajiv Gandhi Bhavan, Nashik', projects:1, lastContact:'2026-07-15'},
    {id:uid(), name:'Sahyadri Warehousing LLP', contact:'Prashant Wagh', phone:'+91 97650 89012', email:'prashant@sahyadriwh.com', address:'Sinnar MIDC, Nashik', projects:1, lastContact:'2026-07-24'},
  ],

/* =======================================================
   AI LAYER — lightweight heuristic "predictions"
======================================================= */

const AI = {
  completion(p){
    const elapsed = daysBetween(p.start, todayISO());
    const totalPlanned = daysBetween(p.start, p.target);
    const rate = p.progress / Math.max(elapsed,1); // % per day
    const daysNeeded = rate > 0 ? Math.round((100 - p.progress) / rate) : 999;
    const projected = new Date(Date.now() + daysNeeded*86400000);
    const delayDays = daysBetween(p.target, projected.toISOString().slice(0,10));
    return {projected, delayDays, totalPlanned, elapsed};
  },
  costOverrun(p){
    const spendRatio = p.spend / p.budget;
    const progressRatio = p.progress / 100;
    const drift = progressRatio > 0 ? (spendRatio - progressRatio) / progressRatio : 0;
    const projectedFinalCost = p.budget * (1 + Math.max(drift,0));
    return {spendRatio, progressRatio, drift, projectedFinalCost};
  },
  riskLevel(p){
    const c = AI.completion(p);
    const co = AI.costOverrun(p);
    if(c.delayDays > 20 || co.drift > 0.18) return 'high';
    if(c.delayDays > 5 || co.drift > 0.07) return 'med';
    return 'low';
  },
  materialAlerts(){
    return state.materials.filter(m => m.qty <= m.threshold);
  },
  labourForecast(site){
    const l = state.labour.filter(x=>x.site===site);
    const avgAtt = l.length ? l.reduce((s,x)=>s+x.attendance/x.days,0)/l.length : 0;
    const shortfall = avgAtt < 0.85;
    return {count: l.length, avgAtt, shortfall};
  },
  safetyRisk(site){
    const logs = state.progress.filter(x=>x.site===site);
    const keywords = ['unsafe','hazard','accident','fall','unguarded','loose','seepage','near-miss','injur'];
    const flagged = logs.filter(l => keywords.some(k => l.issues.toLowerCase().includes(k)));
    return {flagged, level: flagged.length >= 2 ? 'high' : flagged.length === 1 ? 'med' : 'low'};
  },
  generateReport(site){
    const logs = state.progress.filter(x=>x.site===site).sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(!logs.length) return 'No progress data available for this site yet.';
    const latest = logs[0];
    const safety = AI.safetyRisk(site);
    let out = `As of ${fmtDate(latest.date)}, ${site} reports: ${latest.activity}. `;
    out += safety.flagged.length ? `Safety attention required — ${safety.flagged.length} recent entr${safety.flagged.length>1?'ies':'y'} flagged site conditions for review. ` : `No active safety flags in recent logs. `;
    out += logs.length > 1 ? `Compared to the prior entry on ${fmtDate(logs[1].date)}, work has progressed as planned.` : `This is the first logged entry for the site.`;
    return out;
  }
};

        ${flagged?'<span class="badge badge-red">Safety Flag</span>':'<span class="badge badge-green">Normal</span>'}
      </div>
      <div style="margin-top:6px; font-size:13px;">${log.activity}</div>
      <div class="muted" style="margin-top:3px; font-size:12px;">Issues: ${log.issues}</div>
    `;
    list.appendChild(row);
  });
  s.appendChild(list);
  els.content.appendChild(s);

  const repSheet = sheet('AI Generative', 'AI Progress Report Generator', 'Auto-summarised from latest site logs');
  const repGrid = document.createElement('div');
  repGrid.className = 'grid grid-3';
  state.sites.forEach(site=>{
    const div = document.createElement('div');
    div.className = 'ai-card risk-low';
    div.innerHTML = `<div class="ai-card-head"><span class="ai-tag">Report</span></div>
      <div class="ai-card-title">${site.name}</div>
      <div class="ai-card-body" style="margin-top:6px;">${AI.generateReport(site.name)}</div>`;
    repGrid.appendChild(div);
  });
  repSheet.appendChild(repGrid);
  els.content.appendChild(repSheet);
}

    {k:'site', label:'Site', type:'select', options:state.sites.map(s=>s.name), req:true},

    {k:'activity', label:'Activity Summary', type:'textarea', req:true},

/* =======================================================
   SHARED: modal, empty state, delete
======================================================= */
function emptyEl(msg){ const d=document.createElement('div'); d.className='empty'; d.textContent=msg; return d; }

function removeItem(key, id){
  state[key] = state[key].filter(x=>x.id!==id);
  toast('Removed');
  render();
}

function openModal(title, fields, onSubmit){
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="modal-close" id="modal-close">✕</button>
    <div class="sheet-title">${title}</div>
    <form id="modal-form">
      ${fields.map(f=>`
        <div class="field">
          <label>${f.label}${f.req?' *':''}</label>
          ${f.type==='select' ? `<select name="${f.k}" ${f.req?'required':''}>
              <option value="">Select…</option>
              ${(f.options||[]).map(o=>`<option value="${o}">${o}</option>`).join('')}
            </select>`
          : f.type==='textarea' ? `<textarea name="${f.k}" ${f.req?'required':''}></textarea>`
          : `<input type="${f.type}" name="${f.k}" ${f.req?'required':''}>`}
        </div>`).join('')}
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  `;
  backdrop.classList.add('open');
  const close = ()=> backdrop.classList.remove('open');
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  backdrop.onclick = e => { if(e.target===backdrop) close(); };
  document.getElementById('modal-form').onsubmit = e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fields.forEach(f=> data[f.k] = fd.get(f.k));
    onSubmit(data);
    close();
  };
}
