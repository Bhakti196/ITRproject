<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Intelligence — AI Construction CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0c2033;
    --blue-panel:#0f2c44;
    --grid-line:rgba(122,178,204,0.10);
    --grid-line-strong:rgba(122,178,204,0.22);
    --cyan:#7fb8d6;
    --cyan-bright:#a9d4ea;
    --paper:#f4f0e4;
    --paper-dim:#e9e3d2;
    --ink:#132133;
    --ink-soft:#4d5c6b;
    --ink-soft-dark:#8fa3b3;
    --orange:#ff6a3d;
    --orange-dim:#e0572a;
    --green:#4f9d78;
    --amber:#d99a35;
    --red:#d1493f;
    --sidebar-w:230px;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--blue-deep);
    color:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:28px 28px;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--orange); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--grid-line-strong); border-radius:5px;}

  a, button{font-family:inherit;}

  /* ---------- layout shell ---------- */
  #app{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--blue-panel);
    border-right:1px solid var(--grid-line-strong);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--grid-line-strong);
  }
  .brand-mark{
    display:flex; align-items:center; gap:9px;
  }
  .brand-mark svg{flex:0 0 auto;}
  .brand-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.02em;
    line-height:1.2;
    color:var(--paper);
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-top:5px;
  }
  nav#modnav{flex:1; overflow-y:auto; padding:14px 0;}
  .nav-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-soft-dark);
    padding:14px 20px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:8px 20px;
    background:none; border:none;
    color:var(--cyan);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.01em;
    text-align:left;
    cursor:pointer;
    border-left:2px solid transparent;
    position:relative;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.85;}
  .nav-item:hover{background:rgba(122,178,204,0.06); color:var(--paper);}
  .nav-item.active{
    color:var(--paper);
    background:rgba(255,106,61,0.09);
    border-left-color:var(--orange);
  }
  .nav-item .count{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft-dark);
  }
  .sidebar-foot{
    padding:14px 20px 18px;
    border-top:1px solid var(--grid-line-strong);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft-dark);
    letter-spacing:0.04em;
  }
  .sidebar-foot .dot{color:var(--green); margin-right:6px;}

  /* ---------- main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    height:60px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    border-bottom:1px solid var(--grid-line-strong);
    background:rgba(12,32,51,0.85);
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
    flex-wrap:wrap; gap:10px;
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-title{font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600;}
  .topbar-breadcrumb{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft-dark);
  }
  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .tenant-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--cyan);
    border:1px solid var(--grid-line-strong);
    padding:6px 10px;
    border-radius:var(--radius);
    letter-spacing:.03em;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:var(--radius);
    border:1px solid var(--grid-line-strong);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan-bright);}
  .btn-primary{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--orange-dim); border-color:var(--orange-dim); color:#fff;}
  .btn-sm{padding:5px 10px; font-size:10px;}
  .btn-ghost-danger{border-color:transparent; color:var(--red);}
  .btn-ghost-danger:hover{border-color:var(--red); color:var(--red);}

  #content{flex:1; padding:26px 30px 60px;}

  /* ---------- blueprint paper panel (signature element) ---------- */
  .sheet{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:0 12px 28px -14px rgba(0,0,0,0.45);
  }
  .sheet::before, .sheet::after,
  .sheet .cmk1, .sheet .cmk2{
    content:''; position:absolute; width:11px; height:11px;
    border-color:var(--orange); pointer-events:none;
  }
  .sheet::before{top:6px; left:6px; border-top:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet::after{top:6px; right:6px; border-top:2px solid var(--orange); border-right:2px solid var(--orange);}
  .sheet .cmk1{bottom:6px; left:6px; border-bottom:2px solid var(--orange); border-left:2px solid var(--orange);}
  .sheet .cmk2{bottom:6px; right:6px; border-bottom:2px solid var(--orange); border-right:2px solid var(--orange);}

  .sheet-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange-dim);
    margin-bottom:4px;
  }
  .sheet-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .sheet-title .sub{
    font-family:'Inter';
    font-size:12px; font-weight:500;
    color:var(--ink-soft);
  }

  /* ---------- grid helpers ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-5{grid-template-columns:repeat(5,1fr);}
  @media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-5{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:760px){.grid-4,.grid-3,.grid-2,.grid-5{grid-template-columns:1fr;}}

  /* ---------- KPI cards ---------- */
  .kpi{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .kpi-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--cyan);
  }
  .kpi-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px; font-weight:700;
    margin-top:8px;
  }
  .kpi-delta{font-size:11px; margin-top:6px; color:var(--ink-soft-dark);}
  .kpi-delta.up{color:var(--green);}
  .kpi-delta.down{color:var(--red);}

  /* ---------- AI cards ---------- */
  .ai-card{
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    border-left:3px solid var(--cyan);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .ai-card.risk-high{border-left-color:var(--red);}
  .ai-card.risk-med{border-left-color:var(--amber);}
  .ai-card.risk-low{border-left-color:var(--green);}
  .ai-card-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .ai-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--orange);
    border:1px solid rgba(255,106,61,0.4);
    padding:2px 6px; border-radius:2px;
  }
  .ai-card-title{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;}
  .ai-card-body{font-size:12px; color:#cdd8e0; line-height:1.5;}
  .ai-card-body b{color:#fff;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:1.5px solid var(--paper-dim);
    white-space:nowrap;
  }
  tbody td{
    padding:10px 10px;
    border-bottom:1px solid var(--paper-dim);
    color:var(--ink);
    vertical-align:middle;
  }
  tbody tr:hover{background:rgba(255,106,61,0.05);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-mono{font-family:'IBM Plex Mono', monospace; font-size:11.5px;}
  .table-scroll{width:100%; overflow-x:auto;}

  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
    display:inline-block; white-space:nowrap;
  }
  .badge-green{background:rgba(79,157,120,0.15); color:#2f7752;}
  .badge-amber{background:rgba(217,154,53,0.18); color:#9c6c1c;}
  .badge-red{background:rgba(209,73,63,0.15); color:#a83329;}
  .badge-blue{background:rgba(122,178,204,0.18); color:#2a6f8f;}
  .badge-gray{background:rgba(77,92,107,0.14); color:#4d5c6b;}
  .badge-purple{background:rgba(139,105,196,0.16); color:#6a4fa0;}

  .progress-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:6px; overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--orange); border-radius:6px;}
  .progress-fill.green{background:var(--green);}
  .progress-fill.red{background:var(--red);}
  .progress-fill.blue{background:var(--cyan);}

  /* ---------- forms / modal ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .search-input, .filter-select{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:var(--blue-panel);
    border:1px solid var(--grid-line-strong);
    color:var(--paper);
    padding:8px 12px;
    border-radius:var(--radius);
    min-width:170px;
  }
  .search-input::placeholder{color:var(--ink-soft);}
  .filter-select{min-width:130px; cursor:pointer;}
  .filter-select option{background:var(--blue-panel); color:var(--paper);}
  .toolbar-spacer{flex:1;}

  #modal-backdrop{
    position:fixed; inset:0; background:rgba(6,16,26,0.72);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  #modal-backdrop.open{display:flex;}
  #modal{
    background:var(--paper); color:var(--ink);
    width:100%; max-width:520px;
    border-radius:var(--radius);
    padding:24px;
    position:relative;
    max-height:88vh; overflow-y:auto;
  }
  #modal.modal-wide{max-width:760px;}
  #modal .sheet-title{margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px;
    border:1px solid var(--paper-dim);
    background:#fff;
    border-radius:2px;
    font-size:13px; font-family:inherit; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .modal-close{
    position:absolute; top:16px; right:18px;
    background:none; border:none; cursor:pointer;
    font-size:18px; color:var(--ink-soft); line-height:1;
  }

  /* ---------- misc ---------- */
  .empty{
    text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:12.5px;
  }
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .muted{color:var(--ink-soft);}
  .section-gap{margin-top:22px;}
  .chart-wrap{width:100%; overflow-x:auto;}
  .mini-note{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft);
    margin-top:10px; letter-spacing:.02em;
  }
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
  .avatar-dot{
    width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;
  }
  .toast{
    position:fixed; bottom:20px; right:20px;
    background:var(--blue-panel); border:1px solid var(--cyan);
    color:var(--paper); padding:11px 16px; border-radius:2px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
    z-index:200; opacity:0; transform:translateY(6px);
    transition:all .2s ease; pointer-events:none;
    max-width:340px;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  /* ---------- tabs ---------- */
  .tabbar{display:flex; gap:2px; border-bottom:1.5px solid var(--paper-dim); margin-bottom:18px; flex-wrap:wrap;}
  .tab-btn{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:9px 14px; background:none; border:none; cursor:pointer; color:var(--ink-soft);
    border-bottom:2px solid transparent; margin-bottom:-1.5px;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--orange-dim); border-bottom-color:var(--orange);}
  .tab-pane{display:none;}
  .tab-pane.active{display:block; animation:fadein .15s ease;}

  /* ---------- kanban ---------- */
  .kanban-wrap{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
  @media(max-width:1000px){.kanban-wrap{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.kanban-wrap{grid-template-columns:1fr;}}
  .kanban-col{background:var(--paper-dim); border-radius:var(--radius); padding:10px; min-height:80px;}
  .kanban-col-head{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px; display:flex; justify-content:space-between; padding:0 2px;
  }
  .kanban-card{
    background:#fff; border-radius:2px; padding:10px 11px; margin-bottom:8px;
    box-shadow:0 3px 8px -4px rgba(0,0,0,.25); font-size:12px; cursor:pointer;
    border-left:3px solid var(--cyan);
  }
  .kanban-card.pr-critical{border-left-color:var(--red);}
  .kanban-card.pr-high{border-left-color:var(--orange);}
  .kanban-card.pr-medium{border-left-color:var(--amber);}
  .kanban-card.pr-low{border-left-color:var(--green);}
  .kanban-card-title{font-weight:600; margin-bottom:5px;}
  .kanban-card-meta{font-size:10.5px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;}

  /* ---------- misc components ---------- */
  .view-toggle{display:flex; border:1px solid var(--grid-line-strong); border-radius:var(--radius); overflow:hidden;}
  .view-toggle button{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:7px 12px; background:transparent;
    border:none; color:var(--cyan); cursor:pointer;
  }
  .view-toggle button.active{background:var(--orange); color:#fff;}
  .stat-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--paper-dim); font-size:12.5px;}
  .stat-line:last-child{border-bottom:none;}
  .workflow{display:flex; align-items:center; gap:0; margin:6px 0 18px; flex-wrap:wrap;}
  .workflow-step{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 14px; border:1px solid var(--paper-dim); border-radius:20px; color:var(--ink-soft); background:#fff;
  }
  .workflow-step.done{border-color:var(--green); color:#2f7752; background:rgba(79,157,120,0.08);}
  .workflow-step.now{border-color:var(--orange); color:var(--orange-dim); background:rgba(255,106,61,0.08); font-weight:700;}
  .workflow-arrow{color:var(--ink-soft-dark); padding:0 6px; font-size:12px;}
  .weather-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--paper-dim); padding:4px 10px; border-radius:20px;}
  .print-sheet{background:#fff; border:1px solid var(--paper-dim); padding:24px; font-size:12.5px; line-height:1.6;}
  .print-sheet h4{font-family:'Space Grotesk',sans-serif; font-size:14px; margin:16px 0 8px; color:var(--ink);}
  .print-sheet h4:first-child{margin-top:0;}
  .boq-total-box{background:var(--paper-dim); padding:14px 16px; border-radius:2px; margin-top:14px;}
  .boq-total-box .row{display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px;}
  .boq-total-box .row.grand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; border-top:1.5px solid var(--ink-soft); margin-top:6px; padding-top:10px;}
  .role-chip{font-family:'IBM Plex Mono',monospace; font-size:9.5px; padding:3px 8px; border-radius:3px; background:rgba(122,178,204,0.18); color:#2a6f8f;}
  .checklist-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0;}
  .responsive-note{display:none;}
  @media(max-width:640px){
    #sidebar{position:fixed; z-index:60; transform:translateX(-100%); transition:transform .2s ease;}
    #sidebar.open{transform:translateX(0);}
    #content{padding:16px 14px 50px;}
    #topbar{padding:0 14px;}
    .grid-4,.grid-3,.grid-2,.grid-5{grid-template-columns:1fr;}
  }
  #sidebar-toggle{display:none; background:none; border:1px solid var(--grid-line-strong); color:var(--paper); padding:6px 10px; border-radius:2px; cursor:pointer;}
  @media(max-width:640px){#sidebar-toggle{display:inline-block;}}
</style>
</head>
<body>

<div id="login-screen" style="display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--blue-deep); background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size:28px 28px;">
  <div style="width:380px; padding:32px; border:1px solid var(--grid-line-strong); background:var(--blue-panel); border-radius:2px;">
    <div style="margin-bottom:24px; display:flex; align-items:center; gap:10px;">
      <svg width="30" height="30" viewBox="0 0 26 26" fill="none"><rect x="1" y="1" width="24" height="24" stroke="#ff6a3d" stroke-width="1.4"/><path d="M6 20V10L13 5L20 10V20" stroke="#7fb8d6" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 20V14H16V20" stroke="#7fb8d6" stroke-width="1.4"/></svg>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700;">Site Intelligence</div>
        <div style="font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--cyan); margin-top:2px;">AI Construction CRM</div>
      </div>
    </div>

    <form id="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="login-username" required autocomplete="username" placeholder="e.g. admin" style="background:#fff;">
      </div>
      <div class="field">

<script>
/* =======================================================
   DOM REFS / TOAST
======================================================= */
const els = {content: document.getElementById('content'), toast: document.getElementById('toast')};
let currentView = 'dashboard';

function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>els.toast.classList.remove('show'), 2400);
}

function emptyEl(msg){ const d=document.createElement('div'); d.className='empty'; d.textContent=msg; return d; }

function sheet(labelText, titleText, subText){
  const s = document.createElement('div');
  s.className = 'sheet';
  s.innerHTML = `<div class="cmk1"></div><div class="cmk2"></div>
    <div class="sheet-label">${esc(labelText)}</div>
    <div class="sheet-title"><span>${esc(titleText)}</span>${subText?`<span class="sub">${esc(subText)}</span>`:''}</div>`;
  return s;
}

/* =======================================================
   MODAL (supports create + edit, prefill values)
======================================================= */
function openModal(title, fields, onSubmit, opts){
  opts = opts || {};
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.classList.toggle('modal-wide', !!opts.wide);
  const initial = opts.initial || {};

  const fieldHtml = f => {
    const val = initial[f.k] !== undefined ? initial[f.k] : (f.default !== undefined ? f.default : '');
    if(f.type === 'select'){
      const opts2 = (f.options||[]).map(o=>{
        const v = typeof o === 'object' ? o.value : o;
        const l = typeof o === 'object' ? o.label : o;
        const sel = String(v) === String(val) ? 'selected' : '';
        return `<option value="${esc(v)}" ${sel}>${esc(l)}</option>`;
      }).join('');
      return `<select name="${f.k}" ${f.req?'required':''}><option value="">Select…</option>${opts2}</select>`;
    }
    if(f.type === 'textarea'){
      return `<textarea name="${f.k}" ${f.req?'required':''}>${esc(val)}</textarea>`;
    }
    return `<input type="${f.type}" name="${f.k}" ${f.req?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step!==undefined?`step="${f.step}"`:''} value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  };

  modal.innerHTML = `
    <button class="modal-close" id="modal-close" type="button">✕</button>
    <div class="sheet-title">${esc(title)}</div>
    <form id="modal-form">
      <div class="modal-form-body">
        ${fields.map(f=>`<div class="field" style="${f.half?'display:inline-block; width:calc(50% - 6px);':''}">
          <label>${esc(f.label)}${f.req?' *':''}</label>${fieldHtml(f)}
        </div>`).join('')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-save">${opts.saveLabel||'Save'}</button>
      </div>
    </form>`;

  modal.style.display='flex'; modal.style.flexDirection='column'; modal.style.maxHeight='90vh'; modal.style.overflow='hidden';
  const form = document.getElementById('modal-form');
  form.style.display='flex'; form.style.flexDirection='column'; form.style.flex='1'; form.style.minHeight='0'; form.style.overflow='hidden';
  const body = modal.querySelector('.modal-form-body');
  body.style.flex='1'; body.style.minHeight='0'; body.style.overflowY='auto'; body.style.overflowX='hidden'; body.style.paddingRight='8px';
  const actions = modal.querySelector('.modal-actions');
  actions.style.flexShrink='0'; actions.style.padding='14px 0 4px';

  backdrop.classList.add('open');
  const close = () => backdrop.classList.remove('open');
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  backdrop.onclick = e => { if(e.target===backdrop) close(); };

  form.onsubmit = e => {
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const fd = new FormData(form);
    const data = {};
    fields.forEach(f => data[f.k] = fd.get(f.k));
    const saveBtn = document.getElementById('modal-save');
    saveBtn.disabled = true;
    const res = onSubmit(data);
    saveBtn.disabled = false;
    if(res !== false) close();
  };
}

function confirmModal(msg, onYes){
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.classList.remove('modal-wide');
  modal.style.maxWidth = '380px';
  modal.innerHTML = `
    <button class="modal-close" id="modal-close" type="button">✕</button>
    <div class="sheet-title" style="margin-bottom:10px;">Confirm</div>
    <div style="font-size:13px; color:var(--ink-soft); margin-bottom:6px;">${esc(msg)}</div>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-confirm" style="background:var(--red); border-color:var(--red);">Delete</button>
    </div>`;
  backdrop.classList.add('open');
  const close = () => { backdrop.classList.remove('open'); modal.style.maxWidth=''; };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-confirm').onclick = () => { onYes(); close(); };
  backdrop.onclick = e => { if(e.target===backdrop) close(); };
}

/* =======================================================
   GENERIC LIST-MODULE ENGINE
   Powers most simple CRUD modules (Users, Team, Payroll, Safety,
   Attendance, Purchases, Inventory, Equipment...) from one config.
======================================================= */
const moduleFilterState = {}; // key -> {q, ...filters}

function genericModule(cfg){
  // cfg: {key, label, groupLabel, title, sub(items), columns, filters, searchKeys,
  //       formFields(item), newDefaults, badgeMap(key->fn), rowActions:true,
  //       onSave(data, existing), emptyMsg, extraToolbar(node)}
  if(!moduleFilterState[cfg.key]) moduleFilterState[cfg.key] = {q:''};
  const fs = moduleFilterState[cfg.key];
  const items = state[cfg.key];

  const s = sheet(cfg.groupLabel, cfg.title, cfg.sub ? cfg.sub(items) : `${items.length} record(s)`);

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <input class="search-input" id="mf-q-${cfg.key}" placeholder="Search ${esc(cfg.label.toLowerCase())}…" value="${esc(fs.q||'')}">
    ${(cfg.filters||[]).map(f=>`
      <select class="filter-select" id="mf-${f.key}-${cfg.key}">
        <option value="">All ${esc(f.label)}</option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${fs[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`).join('')}
    <div class="toolbar-spacer"></div>
    <button class="btn btn-primary" id="mf-add-${cfg.key}">+ Add ${esc(cfg.singular||cfg.label)}</button>
  `;
  s.appendChild(toolbar);

  toolbar.querySelector(`#mf-q-${cfg.key}`).oninput = e => { fs.q = e.target.value; render(); };
  (cfg.filters||[]).forEach(f=>{
    toolbar.querySelector(`#mf-${f.key}-${cfg.key}`).onchange = e => { fs[f.key] = e.target.value; render(); };
  });
  toolbar.querySelector(`#mf-add-${cfg.key}`).onclick = () => openItemForm(cfg, null);

  let rows = items.slice();
  if(fs.q){
    const q = fs.q.toLowerCase();
    rows = rows.filter(it => (cfg.searchKeys||[]).some(k => String(it[k]||'').toLowerCase().includes(q)));
  }
  (cfg.filters||[]).forEach(f=>{
    if(fs[f.key]) rows = rows.filter(it => String(it[f.key]) === fs[f.key]);
  });

  if(!rows.length){
    s.appendChild(emptyEl(items.length ? 'No records match your search/filter.' : (cfg.emptyMsg || `No ${cfg.label.toLowerCase()} yet — click "+ Add" to create one.`)));
    els.content.appendChild(s);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr>${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows.map(it=>`<tr>${cfg.columns.map(c=>`<td class="${c.mono?'cell-mono':''}">${c.render ? c.render(it) : esc(it[c.key])}</td>`).join('')}
      <td style="white-space:nowrap;">
        <button class="btn btn-sm" onclick="window.__gmEdit('${cfg.key}','${it.id}')">Edit</button>
        <button class="btn btn-sm btn-ghost-danger" onclick="window.__gmDelete('${cfg.key}','${it.id}')">Delete</button>
      </td></tr>`).join('')}</tbody>`;
  wrap.appendChild(tbl);
  s.appendChild(wrap);
  els.content.appendChild(s);
}

window.__gmEdit = (key, id) => {
  const cfg = MODULE_CONFIG[key];
  const item = state[key].find(x=>String(x.id)===String(id));
  openItemForm(cfg, item);
};
window.__gmDelete = (key, id) => {
  const cfg = MODULE_CONFIG[key];
  confirmModal(`Delete this ${(cfg.singular||cfg.label).toLowerCase()} record? This cannot be undone.`, () => {
    state[key] = state[key].filter(x=>String(x.id)!==String(id));
    toast((cfg.singular||cfg.label) + ' deleted');
    render();
  });
};

function openItemForm(cfg, existing){
  const fields = cfg.formFields(existing);
  openModal(existing ? `Edit ${cfg.singular||cfg.label}` : `New ${cfg.singular||cfg.label}`, fields, data => {
    if(cfg.onSave){
      cfg.onSave(data, existing);
    } else {
      if(existing){
        Object.assign(existing, data);
      } else {
        state[cfg.key].unshift(Object.assign({id:uid()}, data));
      }
    }
    toast(existing ? `${cfg.singular||cfg.label} updated` : `${cfg.singular||cfg.label} added`);
    render();
  }, {initial: existing || {}, wide: cfg.wideForm});
}

/* =======================================================
   AI / ANALYTICS LAYER (heuristic, computed from demo data)
======================================================= */
const AI = {
  completion(p){
    const elapsed = Math.max(daysBetween(p.start_date, todayISO()), 0);
    const rate = p.progress / Math.max(elapsed,1);
    const daysNeeded = rate > 0 ? Math.round((100 - p.progress) / rate) : 999;
    const projected = new Date(Date.now() + daysNeeded*86400000);
    const delayDays = daysBetween(p.end_date, projected.toISOString().slice(0,10));
    return {projected, delayDays};
  },
  costOverrun(p){
    const spendRatio = p.spend / Math.max(p.budget,1);
    const progressRatio = p.progress / 100;
    const drift = progressRatio > 0 ? (spendRatio - progressRatio) / progressRatio : 0;
    const projectedFinalCost = p.budget * (1 + Math.max(drift,0));
    return {spendRatio, progressRatio, drift, projectedFinalCost};
  },
  riskLevel(p){
    const c = AI.completion(p);
    const co = AI.costOverrun(p);
    if(c.delayDays > 20 || co.drift > 0.18) return 'high';
    if(c.delayDays > 5 || co.drift > 0.07) return 'med';
    return 'low';
  },
  materialAlerts(){
    return state.materials.filter(m => (m.received - m.issued) <= m.threshold);
  },
  labourForecast(site){
    const l = state.labour.filter(x=>x.site===site);
    const avgAtt = l.length ? l.reduce((s,x)=>s+x.attendance/x.days,0)/l.length : 0;
    return {count: l.length, avgAtt, shortfall: avgAtt < 0.85};
  },
  safetyRisk(project){
    const openInc = state.incidents.filter(i=>i.project===project && i.status==='Open');
    const recent = state.incidents.filter(i=>i.project===project);
    const level = openInc.length ? 'high' : (recent.length ? 'med' : 'low');
    return {open: openInc.length, total: recent.length, level};
  },
  generateProgressReport(project){
    const p = state.projects.find(x=>x.project_name===project);
    if(!p) return 'No data available for this project.';
    const entry = state.diary.filter(d=>d.project===project).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const wp = state.wprogress.find(w=>w.project===project);
    const safety = AI.safetyRisk(project);
    let out = `As of ${fmtDate(todayISO())}, ${project} is at ${p.progress}% physical progress against a planned ${wp?wp.planned:p.progress}%. `;
    if(entry) out += `Latest site diary (${fmtDate(entry.date)}) reports: ${entry.work} `;
    out += safety.open ? `${safety.open} open safety item(s) require attention. ` : `No open safety items on record. `;
    const c = AI.completion(p);
    out += c.delayDays > 0 ? `At the current pace, completion is trending ${c.delayDays} day(s) behind the target date of ${fmtDate(p.end_date)}.` : `The project is trending on or ahead of the target completion date of ${fmtDate(p.end_date)}.`;
    return out;
  }
};

/* =======================================================

======================================================= */

  const totalSpend = state.projects.reduce((s,p)=>s+p.spend,0);
  const activeProjects = state.projects.filter(p=>p.status==='IN_PROGRESS').length;
  const completedProjects = state.projects.filter(p=>p.status==='COMPLETED').length;
  const dueInvoices = state.invoices.filter(i=>i.status!=='Paid').reduce((s,i)=>s+i.amount,0);
  const pendingTasks = state.tasks.filter(t=>t.status!=='Completed').length;
  const lowStock = AI.materialAlerts().length;
  const openIncidents = state.incidents.filter(i=>i.status==='Open').length;
  const pendingPayroll = state.payroll.filter(p=>p.status==='Pending').reduce((s,p)=>s+(p.salary+p.overtime-p.deductions),0);
  const todayAtt = state.attendance.filter(a=>a.status==='Present').length;

  const kpiWrap = document.createElement('div');
  kpiWrap.className = 'grid grid-4';
  kpiWrap.innerHTML = `
    <div class="kpi"><div class="kpi-label">Total / Active Projects</div><div class="kpi-value">${state.projects.length} / ${activeProjects}</div><div class="kpi-delta">${completedProjects} completed</div></div>
    <div class="kpi"><div class="kpi-label">Portfolio Budget</div><div class="kpi-value">${fmtMoney(totalBudget)}</div><div class="kpi-delta">${fmtMoney(totalSpend)} spent</div></div>
    <div class="kpi"><div class="kpi-label">Pending Tasks</div><div class="kpi-value">${pendingTasks}</div><div class="kpi-delta">${state.tasks.filter(t=>t.status==='Blocked').length} blocked</div></div>
    <div class="kpi"><div class="kpi-label">Outstanding Receivables</div><div class="kpi-value">${fmtMoney(dueInvoices)}</div><div class="kpi-delta down">${state.invoices.filter(i=>i.status==='Overdue').length} overdue invoice(s)</div></div>
    <div class="kpi"><div class="kpi-label">Attendance Today</div><div class="kpi-value">${todayAtt}/${state.attendance.length}</div><div class="kpi-delta">workers present</div></div>
    <div class="kpi"><div class="kpi-label">Low Stock Items</div><div class="kpi-value">${lowStock}</div><div class="kpi-delta ${lowStock?'down':'up'}">of ${state.materials.length} materials tracked</div></div>
    <div class="kpi"><div class="kpi-label">Open Safety Incidents</div><div class="kpi-value">${openIncidents}</div><div class="kpi-delta ${openIncidents?'down':'up'}">of ${state.incidents.length} logged</div></div>
    <div class="kpi"><div class="kpi-label">Pending Payroll</div><div class="kpi-value">${fmtMoney(pendingPayroll)}</div><div class="kpi-delta">${state.payroll.filter(p=>p.status==='Pending').length} employee(s)</div></div>
  `;
  els.content.appendChild(kpiWrap);

  const aiSheet = sheet('AI Intelligence Layer', 'Predictive Signals', 'Recalculated from live project, site & resource data');
  const aiGrid = document.createElement('div');
  aiGrid.className = 'grid grid-3 section-gap';
  state.projects.filter(p=>p.status!=='COMPLETED').forEach(p=>{
    const c = AI.completion(p);
    const co = AI.costOverrun(p);
    const risk = AI.riskLevel(p);
    const card = document.createElement('div');
    card.className = `ai-card risk-${risk}`;
    card.innerHTML = `
      <div class="ai-card-head"><span class="ai-tag">Completion + Cost</span></div>
      <div class="ai-card-title">${esc(p.project_name)}</div>
      <div class="ai-card-body" style="margin-top:6px;">
        Projected finish: <b>${fmtDate(c.projected)}</b> (${c.delayDays > 0 ? c.delayDays+' days late' : 'on schedule'})<br>
        Projected final cost: <b>${fmtMoney(Math.round(co.projectedFinalCost))}</b> vs budget ${fmtMoney(p.budget)}<br>
        Risk level: <b style="text-transform:capitalize">${risk}</b>
      </div>`;
    aiGrid.appendChild(card);
  });
  aiSheet.appendChild(aiGrid);

  const aiGrid2 = document.createElement('div');
  aiGrid2.className = 'grid grid-3 section-gap';
  const matAlerts = AI.materialAlerts();
  aiGrid2.innerHTML += `
    <div class="ai-card ${matAlerts.length?'risk-med':'risk-low'}">
      <div class="ai-card-head"><span class="ai-tag">Material Forecast</span></div>
      <div class="ai-card-title">Reorder Alerts</div>
      <div class="ai-card-body" style="margin-top:6px;">
        ${matAlerts.length ? matAlerts.map(m=>`<b>${esc(m.item)}</b> at ${esc(m.site)} — ${m.received-m.issued} ${esc(m.unit)} left (below ${m.threshold})`).join('<br>') : 'All stock levels within safe threshold.'}
      </div>
    </div>`;
  state.projects.filter(p=>p.status!=='COMPLETED').slice(0,2).forEach(p=>{
    const lf = AI.labourForecast(state.sites.find(s=>s.name===p.site_name)?.name || p.site_name);
    const sr = AI.safetyRisk(p.project_name);
    aiGrid2.innerHTML += `
      <div class="ai-card risk-${sr.level}">
        <div class="ai-card-head"><span class="ai-tag">Labour + Safety</span></div>
        <div class="ai-card-title">${esc(p.project_name)}</div>
        <div class="ai-card-body" style="margin-top:6px;">
          Avg. attendance: <b>${Math.round(lf.avgAtt*100)}%</b> ${lf.shortfall ? '— below optimal, workforce top-up recommended' : '— adequate deployment'}<br>
          Safety incidents: <b>${sr.total}</b> (${sr.open} open) ${sr.level==='high' ? '— escalate to site supervisor' : sr.level==='med' ? '— monitor closely' : '— no action needed'}
        </div>
      </div>`;
  });
  aiSheet.appendChild(aiGrid2);
  els.content.appendChild(aiSheet);

  const projSheet = sheet('Execution', 'Project Status', `${state.projects.length} project(s)`);
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th>Project</th><th>Site</th><th>Progress</th><th>Budget vs Spend</th><th>Status</th></tr></thead>
    <tbody>${state.projects.map(p=>`
      <tr style="cursor:pointer;" onclick="openProjectDetail('${p.id}')">
        <td><b>${esc(p.project_name)}</b></td>
        <td class="muted">${esc(p.site_name)}</td>
        <td style="min-width:140px;">
          <div class="progress-track"><div class="progress-fill ${p.progress<40?'red':(p.progress<75?'':'green')}" style="width:${p.progress}%"></div></div>
          <span class="cell-mono" style="font-size:10.5px;">${p.progress}%</span>
        </td>
        <td class="cell-mono">${fmtMoney(p.spend)} / ${fmtMoney(p.budget)}</td>
        <td><span class="badge ${PROJECT_STATUS_BADGE[p.status]||'badge-gray'}">${PROJECT_STATUS_LABEL[p.status]||p.status}</span></td>
      </tr>`).join('')}</tbody>`;
  projSheet.appendChild(tbl);
  els.content.appendChild(projSheet);
}
</script>
<script>
/* =======================================================
   PROJECTS (list + detail with tabs)
======================================================= */
let projectDetailId = null;

function renderProjects(){
  if(projectDetailId){ renderProjectDetail(projectDetailId); return; }
  const s = sheet('Execution', 'Project Management', `${state.projects.length} project(s)`);
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <input class="search-input" id="proj-q" placeholder="Search projects…" value="${esc(moduleFilterState.projects?.q||'')}">
    <select class="filter-select" id="proj-status">
      <option value="">All Status</option>
      <option value="NOT_STARTED">Not Started</option>
      <option value="IN_PROGRESS">In Progress</option>
      <option value="COMPLETED">Completed</option>
    </select>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-primary" id="proj-add">+ New Project</button>`;
  s.appendChild(toolbar);
  if(!moduleFilterState.projects) moduleFilterState.projects = {q:'', status:''};
  const fs = moduleFilterState.projects;
  toolbar.querySelector('#proj-q').value = fs.q||'';
  toolbar.querySelector('#proj-status').value = fs.status||'';
  toolbar.querySelector('#proj-q').oninput = e=>{ fs.q=e.target.value; render(); };
  toolbar.querySelector('#proj-status').onchange = e=>{ fs.status=e.target.value; render(); };
  toolbar.querySelector('#proj-add').onclick = openProjectForm;

  let rows = state.projects.slice();
  if(fs.q){ const q=fs.q.toLowerCase(); rows = rows.filter(p=>p.project_name.toLowerCase().includes(q) || p.client.toLowerCase().includes(q) || p.site_name.toLowerCase().includes(q)); }
  if(fs.status){ rows = rows.filter(p=>p.status===fs.status); }

  if(!rows.length){ s.appendChild(emptyEl('No projects match — click "+ New Project" to create one.')); els.content.appendChild(s); return; }

  const wrap = document.createElement('div'); wrap.className='table-scroll';
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th>Project</th><th>Client</th><th>Site</th><th>Start → End</th><th>Budget</th><th>Progress</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(p=>`
      <tr>
        <td style="cursor:pointer;" onclick="openProjectDetail('${p.id}')"><b>${esc(p.project_name)}</b></td>
        <td class="muted">${esc(p.client)}</td>
        <td class="muted">${esc(p.site_name)}</td>
        <td class="cell-mono" style="font-size:11px;">${fmtDate(p.start_date)} → ${fmtDate(p.end_date)}</td>
        <td class="cell-mono">${fmtMoney(p.budget)}</td>
        <td style="min-width:110px;"><div class="progress-track"><div class="progress-fill ${p.progress<40?'red':(p.progress<75?'':'green')}" style="width:${p.progress}%"></div></div><span class="cell-mono" style="font-size:10.5px;">${p.progress}%</span></td>
        <td><span class="badge ${PROJECT_STATUS_BADGE[p.status]||'badge-gray'}">${PROJECT_STATUS_LABEL[p.status]||p.status}</span></td>
        <td style="white-space:nowrap;">
          <button class="btn btn-sm" onclick="openProjectDetail('${p.id}')">View</button>
          <button class="btn btn-sm" onclick="openProjectForm('${p.id}')">Edit</button>
          <button class="btn btn-sm btn-ghost-danger" onclick="deleteProject('${p.id}')">Delete</button>
        </td>
      </tr>`).join('')}</tbody>`;
  wrap.appendChild(tbl);
  s.appendChild(wrap);
  els.content.appendChild(s);
}

function openProjectForm(id){
  const existing = id ? state.projects.find(p=>String(p.id)===String(id)) : null;
  openModal(existing?'Edit Project':'New Project', [
    {k:'project_name', label:'Project Name', type:'text', req:true},
    {k:'client', label:'Client', type:'select', req:true, options: state.clients.map(c=>c.name)},
    {k:'site_name', label:'Site / Location', type:'select', req:true, options:siteNameOptions()},
    {k:'manager', label:'Project Manager', type:'text', req:true},
    {k:'start_date', label:'Start Date', type:'date', req:true},
    {k:'end_date', label:'Target End Date', type:'date', req:true},
    {k:'budget', label:'Budget (₹)', type:'number', req:true, min:0},
    {k:'spend', label:'Spend to Date (₹)', type:'number', min:0, default:0},
    {k:'progress', label:'Physical Progress (%)', type:'number', min:0, max:100, default:0},
    {k:'status', label:'Status', type:'select', req:true, options:[
      {value:'NOT_STARTED', label:'Not Started'},{value:'IN_PROGRESS', label:'In Progress'},{value:'COMPLETED', label:'Completed'}]},
  ], data=>{
    const rec = {project_name:data.project_name, client:data.client, site_name:data.site_name, manager:data.manager, location:data.site_name,
      start_date:data.start_date, end_date:data.end_date, budget:Number(data.budget), spend:Number(data.spend||0), progress:Number(data.progress||0), status:data.status};
    if(existing){ Object.assign(existing, rec); toast('Project updated'); }
    else { state.projects.unshift(Object.assign({id:uid()}, rec)); toast('Project created'); }
    render();
  }, {initial: existing || {}, wide:true});
}

function deleteProject(id){
  confirmModal('Delete this project? This cannot be undone.', ()=>{
    state.projects = state.projects.filter(p=>String(p.id)!==String(id));
    toast('Project deleted');
    render();
  });
}

function openProjectDetail(id){
  projectDetailId = id;
  currentView = 'projects';
  render();
}

let projectDetailTab = 'overview';
function renderProjectDetail(id){
  const p = state.projects.find(x=>String(x.id)===String(id));
  if(!p){ projectDetailId=null; renderProjects(); return; }

  const back = document.createElement('button');
  back.className = 'btn btn-sm'; back.style.marginBottom='14px';
  back.textContent = '← Back to Projects';
  back.onclick = ()=>{ projectDetailId=null; render(); };
  els.content.appendChild(back);

  const head = sheet('Execution', p.project_name, `${p.client} · ${p.site_name}`);
  const kpis = document.createElement('div');
  kpis.className = 'grid grid-4';
  kpis.innerHTML = `
    <div class="kpi"><div class="kpi-label">Progress</div><div class="kpi-value">${p.progress}%</div><div class="kpi-delta">${PROJECT_STATUS_LABEL[p.status]}</div></div>
    <div class="kpi"><div class="kpi-label">Budget</div><div class="kpi-value">${fmtMoney(p.budget)}</div><div class="kpi-delta">${fmtMoney(p.spend)} spent</div></div>
    <div class="kpi"><div class="kpi-label">Timeline</div><div class="kpi-value" style="font-size:15px;">${fmtDate(p.start_date)}</div><div class="kpi-delta">to ${fmtDate(p.end_date)}</div></div>
    <div class="kpi"><div class="kpi-label">Manager</div><div class="kpi-value" style="font-size:16px;">${esc(p.manager)}</div></div>
  `;
  head.appendChild(kpis);

  const tabs = [
    ['overview','Overview'], ['team','Team'], ['tasks','Tasks'], ['diary','Site Diary'],
    ['materials','Materials'], ['equipment','Equipment'], ['progress','Progress'],
    ['boq','Estimation / BOQ'], ['purchase','Purchases'], ['billing','Billing'], ['reports','AI Report'],
  ];
  const tabbar = document.createElement('div'); tabbar.className='tabbar section-gap';
  tabbar.innerHTML = tabs.map(([k,l])=>`<button class="tab-btn ${projectDetailTab===k?'active':''}" data-tab="${k}">${l}</button>`).join('');
  head.appendChild(tabbar);

  const paneWrap = document.createElement('div');
  head.appendChild(paneWrap);
  els.content.appendChild(head);

  tabbar.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{ projectDetailTab=b.dataset.tab; render(); });

  const risk = AI.riskLevel(p);
  const c = AI.completion(p);
  const co = AI.costOverrun(p);

  const renderers = {
    overview: () => `
      <div class="grid grid-2">
        <div>
          <div class="stat-line"><span class="muted">Client</span><b>${esc(p.client)}</b></div>
          <div class="stat-line"><span class="muted">Location</span><b>${esc(p.location||p.site_name)}</b></div>
          <div class="stat-line"><span class="muted">Manager</span><b>${esc(p.manager)}</b></div>
          <div class="stat-line"><span class="muted">Start Date</span><b>${fmtDate(p.start_date)}</b></div>
          <div class="stat-line"><span class="muted">Target End Date</span><b>${fmtDate(p.end_date)}</b></div>
          <div class="stat-line"><span class="muted">Status</span>${stBadge(PROJECT_STATUS_LABEL[p.status])}</div>
        </div>
        <div class="ai-card risk-${risk}">
          <div class="ai-card-head"><span class="ai-tag">AI Risk Assessment</span></div>
          <div class="ai-card-title">Completion &amp; Cost Overrun Risk</div>
          <div class="ai-card-body" style="margin-top:6px;">
            Projected finish: <b>${fmtDate(c.projected)}</b> (${c.delayDays>0?c.delayDays+' days late':'on schedule'})<br>
            Projected final cost: <b>${fmtMoney(Math.round(co.projectedFinalCost))}</b><br>
            Overall risk level: <b style="text-transform:capitalize;">${risk}</b>
          </div>
        </div>
      </div>`,
    team: () => renderMiniList(state.team.filter(t=>t.project===p.project_name), ['name','designation','role','phone','status'], ['Name','Designation','Role','Phone','Status'], 'No team members assigned to this project yet.'),
    tasks: () => renderMiniList(state.tasks.filter(t=>t.project===p.project_name), ['name','assignee','priority','status','due'], ['Task','Assignee','Priority','Status','Due'], 'No tasks logged for this project yet.'),
    diary: () => renderMiniList(state.diary.filter(d=>d.project===p.project_name), ['date','weather','work','workforce'], ['Date','Weather','Work Performed','Workforce'], 'No diary entries for this project yet.'),
    materials: () => renderMiniList(state.materials.filter(m=>m.site===p.site_name), ['item','received','issued','threshold'], ['Material','Received','Issued','Min. Stock'], 'No materials tracked at this site yet.'),
    equipment: () => renderMiniList(state.equipment.filter(e=>e.site===p.site_name), ['name','operator','status','utilization'], ['Equipment','Operator','Status','Utilization %'], 'No equipment assigned to this site yet.'),
    progress: () => renderMiniList(state.wprogress.filter(w=>w.project===p.project_name), ['activity','planned','actual','status'], ['Activity','Planned %','Actual %','Status'], 'No work-progress entries for this project yet.'),
    boq: () => {
      const est = state.estimates.find(e=>e.project===p.project_name);
      return est ? `<div class="mini-note" style="margin-bottom:10px;">Estimate ${esc(est.estNo)} linked to this project.</div>` + renderMiniList(est.boq, ['code','desc','qty','unit','rate'], ['Code','Description','Qty','Unit','Rate'], '')
        : `<div class="empty">No estimate/BOQ linked to this project yet. <br><br><button class="btn btn-primary btn-sm" onclick="currentView='boq'; projectDetailId=null; render();">Go to Estimate / BOQ →</button></div>`;
    },
    purchase: () => renderMiniList(state.purchases.filter(pu=>pu.project===p.project_name), ['purchase_number','supplier_name','item_name','total_amount','status'], ['PO #','Supplier','Item','Total','Status'], 'No purchases raised for this project yet.'),
    billing: () => renderMiniList(state.invoices.filter(i=>i.project===p.project_name), ['num','amount','date','status'], ['Invoice #','Amount','Date','Status'], 'No invoices raised for this project yet.'),
    reports: () => `
      <div class="ai-card risk-${risk}">
        <div class="ai-card-head"><span class="ai-tag">AI Generated</span></div>
        <div class="ai-card-title">Progress Report</div>
        <div class="ai-card-body" style="margin-top:8px; font-size:12.5px;">${esc(AI.generateProgressReport(p.project_name))}</div>
      </div>
      <button class="btn btn-primary btn-sm section-gap" id="regen-report">↻ Regenerate Report</button>`,
  };

  paneWrap.innerHTML = renderers[projectDetailTab] ? renderers[projectDetailTab]() : '';
  const regenBtn = paneWrap.querySelector('#regen-report');
  if(regenBtn) regenBtn.onclick = ()=>{ toast('AI report regenerated'); render(); };
}

function renderMiniList(rows, keys, labels, emptyMsg){
  if(!rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<div class="table-scroll"><table><thead><tr>${labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${keys.map(k=>{
      let v = r[k];
      if(typeof v === 'number' && (k.includes('amount')||k==='rate'||k==='received'||k==='issued'||k==='threshold')) v = k==='received'||k==='issued'||k==='threshold' ? v : fmtMoney(v);
      if(k==='date'||k==='due') v = fmtDate(v);
      if(k==='status') return `<td>${stBadge(v)}</td>`;
      if(k==='priority') return `<td>${stBadge(v)}</td>`;
      return `<td>${esc(v)}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
</script>
<script>
/* =======================================================
   ESTIMATE / BOQ  (flagship module — extra polish)
======================================================= */
let boqActiveId = null;

function computeEstimateTotals(est){
  const c = est.costs;
  const materialCost = est.boq.reduce((s,i)=>s + (i.qty*i.rate), 0);
  const subtotal = materialCost + Number(c.labour||0) + Number(c.contractor||0) + Number(c.equipment||0) + Number(c.transport||0) + Number(c.misc||0);
  const overhead = subtotal * (Number(c.overheadPct||0)/100);
  const contingency = subtotal * (Number(c.contingencyPct||0)/100);
  const taxable = subtotal + overhead + contingency;
  const tax = taxable * (Number(c.taxPct||0)/100);
  const grand = taxable + tax - Number(c.discount||0);
  return {materialCost, subtotal, overhead, contingency, tax, grand};
}

function renderBoq(){
  if(!state.estimates.length){
    const s = sheet('Management','Estimate / BOQ','No estimates yet');
    const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='+ New Estimate';
    btn.onclick = openEstimateForm;
    s.appendChild(emptyEl('No estimates yet — create your first project estimate & BOQ.'));
    s.appendChild(btn);
    els.content.appendChild(s);
    return;
  }
  if(!boqActiveId) boqActiveId = state.estimates[0].id;
  const est = state.estimates.find(e=>String(e.id)===String(boqActiveId)) || state.estimates[0];
  const totals = computeEstimateTotals(est);

  const s = sheet('Management', 'Estimate / BOQ', `${state.estimates.length} estimate(s)`);
  const toolbar = document.createElement('div'); toolbar.className='toolbar';
  toolbar.innerHTML = `
    <select class="filter-select" id="boq-select" style="min-width:280px;">
      ${state.estimates.map(e=>`<option value="${e.id}" ${e.id===est.id?'selected':''}>${esc(e.estNo)} — ${esc(e.project)}</option>`).join('')}
    </select>
    <div class="toolbar-spacer"></div>
    <button class="btn" id="boq-print">🖨 Print Preview</button>
    <button class="btn btn-primary" id="boq-new">+ New Estimate</button>`;
  s.appendChild(toolbar);
  toolbar.querySelector('#boq-select').onchange = e=>{ boqActiveId = e.target.value; render(); };
  toolbar.querySelector('#boq-new').onclick = openEstimateForm;
  toolbar.querySelector('#boq-print').onclick = ()=>{ boqPrintPreview(est, totals); };

  const meta = document.createElement('div'); meta.className='grid grid-4 section-gap';
  meta.innerHTML = `
    <div class="kpi"><div class="kpi-label">Estimate No.</div><div class="kpi-value" style="font-size:16px;">${esc(est.estNo)}</div><div class="kpi-delta">${stBadge(est.status)}</div></div>
    <div class="kpi"><div class="kpi-label">Client</div><div class="kpi-value" style="font-size:15px;">${esc(est.client)}</div><div class="kpi-delta">${esc(est.site)}</div></div>
    <div class="kpi"><div class="kpi-label">Prepared By</div><div class="kpi-value" style="font-size:16px;">${esc(est.preparedBy)}</div><div class="kpi-delta">${fmtDate(est.date)} · valid ${esc(est.validity)}</div></div>
    <div class="kpi"><div class="kpi-label">Grand Total</div><div class="kpi-value">${fmtMoney(Math.round(totals.grand))}</div><div class="kpi-delta">incl. tax &amp; contingency</div></div>`;
  s.appendChild(meta);

  const costSheet = document.createElement('div'); costSheet.className='section-gap';
  costSheet.innerHTML = `
    <div class="sheet-title" style="font-size:15px; margin-bottom:10px;"><span>Cost Breakdown</span><button class="btn btn-sm" id="boq-edit-costs">Edit Costs</button></div>
    <div class="grid grid-3">
      <div class="stat-line"><span class="muted">Material (from BOQ)</span><b>${fmtMoney(totals.materialCost)}</b></div>
      <div class="stat-line"><span class="muted">Labour</span><b>${fmtMoney(est.costs.labour)}</b></div>
      <div class="stat-line"><span class="muted">Contractor</span><b>${fmtMoney(est.costs.contractor)}</b></div>
      <div class="stat-line"><span class="muted">Equipment</span><b>${fmtMoney(est.costs.equipment)}</b></div>
      <div class="stat-line"><span class="muted">Transport</span><b>${fmtMoney(est.costs.transport)}</b></div>

<script>
/* =======================================================
   TASK MANAGEMENT (list + kanban)
======================================================= */
let taskViewMode = 'kanban';
let taskFilters = {q:'', project:'', priority:''};

function renderTasks(){
  const s = sheet('Site Operations', 'Task Management', `${state.tasks.length} task(s)`);
  const toolbar = document.createElement('div'); toolbar.className='toolbar';
  toolbar.innerHTML = `
    <input class="search-input" id="tk-q" placeholder="Search tasks…" value="${esc(taskFilters.q)}">
    <select class="filter-select" id="tk-project"><option value="">All Projects</option>${state.projects.map(p=>`<option value="${esc(p.project_name)}" ${taskFilters.project===p.project_name?'selected':''}>${esc(p.project_name)}</option>`).join('')}</select>
    <select class="filter-select" id="tk-priority"><option value="">All Priority</option>${['Low','Medium','High','Critical'].map(x=>`<option ${taskFilters.priority===x?'selected':''}>${x}</option>`).join('')}</select>
    <div class="toolbar-spacer"></div>
    <div class="view-toggle"><button id="tk-view-kanban" class="${taskViewMode==='kanban'?'active':''}">Kanban</button><button id="tk-view-list" class="${taskViewMode==='list'?'active':''}">List</button></div>
    <button class="btn btn-primary" id="tk-add">+ Add Task</button>`;
  s.appendChild(toolbar);
  els.content.appendChild(s);

  toolbar.querySelector('#tk-q').oninput = e=>{ taskFilters.q=e.target.value; render(); };
  toolbar.querySelector('#tk-project').onchange = e=>{ taskFilters.project=e.target.value; render(); };
  toolbar.querySelector('#tk-priority').onchange = e=>{ taskFilters.priority=e.target.value; render(); };
  toolbar.querySelector('#tk-view-kanban').onclick = ()=>{ taskViewMode='kanban'; render(); };
  toolbar.querySelector('#tk-view-list').onclick = ()=>{ taskViewMode='list'; render(); };
  toolbar.querySelector('#tk-add').onclick = ()=>openTaskForm(null);

  let rows = state.tasks.slice();
  if(taskFilters.q){ const q=taskFilters.q.toLowerCase(); rows = rows.filter(t=>t.name.toLowerCase().includes(q)||t.assignee.toLowerCase().includes(q)); }
  if(taskFilters.project) rows = rows.filter(t=>t.project===taskFilters.project);
  if(taskFilters.priority) rows = rows.filter(t=>t.priority===taskFilters.priority);

  if(!rows.length){ const w = sheet('','',''); w.className=''; els.content.appendChild(emptyEl('No tasks match — click "+ Add Task" to create one.')); return; }

  if(taskViewMode==='kanban'){
    const cols = ['To Do','In Progress','Blocked','Completed'];
    const board = document.createElement('div'); board.className='kanban-wrap';
    cols.forEach(col=>{
      const colTasks = rows.filter(t=>t.status===col);
      const colEl = document.createElement('div'); colEl.className='kanban-col';
      colEl.innerHTML = `<div class="kanban-col-head"><span>${esc(col)}</span><span>${colTasks.length}</span></div>` +
        colTasks.map(t=>`<div class="kanban-card pr-${t.priority.toLowerCase()}" onclick="openTaskForm('${t.id}')">
          <div class="kanban-card-title">${esc(t.name)}</div>
          <div class="muted" style="font-size:10.5px; margin-bottom:6px;">${esc(t.project)}</div>
          <div class="kanban-card-meta"><span>${esc(t.assignee)}</span><span>${fmtDate(t.due)}</span></div>
        </div>`).join('') + (colTasks.length?'':'<div class="empty" style="padding:14px 4px;">No tasks</div>');
      board.appendChild(colEl);
    });
    els.content.appendChild(board);
  } else {
    const wrap = document.createElement('div'); wrap.className='sheet';
    wrap.innerHTML = `<div class="cmk1"></div><div class="cmk2"></div>`;
    const tblWrap = document.createElement('div'); tblWrap.className='table-scroll';
    tblWrap.innerHTML = `<table><thead><tr><th>Task</th><th>Project</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th><th>Progress</th><th></th></tr></thead>
      <tbody>${rows.map(t=>`<tr>
        <td><b>${esc(t.name)}</b></td><td class="muted">${esc(t.project)}</td><td>${esc(t.assignee)}</td>
        <td>${stBadge(t.priority)}</td><td>${stBadge(t.status)}</td><td class="cell-mono">${fmtDate(t.due)}</td>
        <td style="min-width:100px;"><div class="progress-track"><div class="progress-fill" style="width:${t.progress}%"></div></div></td>
        <td style="white-space:nowrap;"><button class="btn btn-sm" onclick="openTaskForm('${t.id}')">Edit</button> <button class="btn btn-sm btn-ghost-danger" onclick="deleteTask('${t.id}')">Delete</button></td>
      </tr>`).join('')}</tbody>`;
    wrap.appendChild(tblWrap);
    els.content.appendChild(wrap);
  }
}

function openTaskForm(id){
  const existing = id ? state.tasks.find(t=>String(t.id)===String(id)) : null;
  const fields = [
    {k:'name', label:'Task Name', type:'text', req:true},
    {k:'project', label:'Project', type:'select', req:true, options:projectNameOptions()},
    {k:'assignee', label:'Assigned To', type:'text', req:true},
    {k:'priority', label:'Priority', type:'select', req:true, options:['Low','Medium','High','Critical']},
    {k:'status', label:'Status', type:'select', req:true, options:['To Do','In Progress','Blocked','Completed']},
    {k:'start', label:'Start Date', type:'date', req:true},
    {k:'due', label:'Due Date', type:'date', req:true},
    {k:'progress', label:'Progress (%)', type:'number', min:0, max:100, default:0},
    {k:'description', label:'Description', type:'textarea'},
  ];
  openModal(existing?'Edit Task':'Add Task', fields, data=>{
    const rec = Object.assign({}, data, {progress:Number(data.progress||0)});
    if(existing){ Object.assign(existing, rec); toast('Task updated'); }
    else { state.tasks.unshift(Object.assign({id:uid()}, rec)); toast('Task added'); }
    render();
  }, {initial: existing||{}, wide:true});
}
function deleteTask(id){
  confirmModal('Delete this task?', ()=>{
    state.tasks = state.tasks.filter(t=>String(t.id)!==String(id));
    toast('Task deleted');
    render();
  });
}

      </div>

      <div class="grid grid-2">
        <div><div class="stat-line"><span class="muted">Materials Used</span></div><p style="font-size:12px;">${esc(d.materials)}</p></div>
        <div><div class="stat-line"><span class="muted">Equipment Used</span></div><p style="font-size:12px;">${esc(d.equipment)}</p></div>
      </div>
      <div class="grid grid-3 section-gap">
        <div><div class="stat-line"><span class="muted">Progress</span></div><p style="font-size:12px;">${esc(d.progress)}</p></div>
        <div><div class="stat-line"><span class="muted">Issues / Delays</span></div><p style="font-size:12px;">${esc(d.issues)} ${d.delays&&d.delays!=='None'?'— '+esc(d.delays):''}</p></div>
        <div><div class="stat-line"><span class="muted">Safety Observations</span></div><p style="font-size:12px;">${esc(d.safety)}</p></div>
      </div>`;
    card.querySelector('[data-edit]').onclick = ()=>openDiaryForm(d);
    card.querySelector('[data-del]').onclick = ()=>{ confirmModal('Delete this diary entry?', ()=>{ state.diary=state.diary.filter(x=>x.id!==d.id); toast('Diary entry deleted'); render(); }); };
    els.content.appendChild(card);
  });
}

function openDiaryForm(existing){
  const fields = [
    {k:'date', label:'Date', type:'date', req:true, default:todayISO()},
    {k:'project', label:'Project', type:'select', req:true, options:projectNameOptions()},
    {k:'site', label:'Site', type:'select', req:true, options:siteNameOptions()},
    {k:'weather', label:'Weather', type:'text', req:true, placeholder:'e.g. Clear, 30°C'},
    {k:'workforce', label:'Workforce Count', type:'number', min:0, req:true},
    {k:'contractor', label:'Contractor on Site', type:'text'},
    {k:'work', label:'Work Performed', type:'textarea', req:true},
    {k:'materials', label:'Materials Used', type:'textarea'},
    {k:'equipment', label:'Equipment Used', type:'textarea'},
    {k:'progress', label:'Progress Note', type:'text', default:'On schedule'},
    {k:'issues', label:'Issues', type:'textarea', default:'None reported'},
    {k:'delays', label:'Delays', type:'text', default:'None'},
    {k:'safety', label:'Safety Observations', type:'textarea'},
    {k:'remarks', label:'Remarks', type:'textarea'},
  ];
  openModal(existing?'Edit Diary Entry':'Add Diary Entry', fields, data=>{
    if(existing){ Object.assign(existing, data); toast('Diary entry updated'); }
    else { state.diary.unshift(Object.assign({id:uid()}, data)); toast('Diary entry added'); }
    render();
  }, {initial: existing||{}, wide:true});
}

/* =======================================================
   WORK PROGRESS MANAGEMENT
======================================================= */
function renderWprogress(){
  const s = sheet('Site Operations', 'Work Progress Management', `${state.wprogress.length} activity record(s)`);
  const toolbar = document.createElement('div'); toolbar.className='toolbar';
  toolbar.innerHTML = `<div class="toolbar-spacer"></div><button class="btn btn-primary" id="wp-add">+ Add Progress Entry</button>`;
  s.appendChild(toolbar);
  toolbar.querySelector('#wp-add').onclick = ()=>openWprogressForm(null);

  const onTrack = state.wprogress.filter(w=>w.status==='On Track').length;
  const delayed = state.wprogress.filter(w=>w.status==='Delayed').length;
  const kpi = document.createElement('div'); kpi.className='grid grid-4 section-gap';
  kpi.innerHTML = `
    <div class="kpi"><div class="kpi-label">Activities Tracked</div><div class="kpi-value">${state.wprogress.length}</div></div>
    <div class="kpi"><div class="kpi-label">On Track</div><div class="kpi-value" style="color:var(--green)">${onTrack}</div></div>
    <div class="kpi"><div class="kpi-label">Delayed</div><div class="kpi-value" style="color:var(--red)">${delayed}</div></div>
    <div class="kpi"><div class="kpi-label">Avg. Variance</div><div class="kpi-value">${Math.round(state.wprogress.reduce((s,w)=>s+(w.actual-w.planned),0)/state.wprogress.length)}%</div></div>`;
  s.appendChild(kpi);

  const wrap = document.createElement('div'); wrap.className='table-scroll section-gap';
  wrap.innerHTML = `<table><thead><tr><th>Project</th><th>Activity</th><th>Milestone</th><th>Planned %</th><th>Actual %</th><th>Variance</th><th>Status</th><th></th></tr></thead>
    <tbody>${state.wprogress.map(w=>{
      const variance = w.actual - w.planned;
      return `<tr>
        <td><b>${esc(w.project)}</b></td><td>${esc(w.activity)}</td><td class="muted">${esc(w.milestone)}</td>
        <td style="min-width:100px;"><div class="progress-track"><div class="progress-fill blue" style="width:${w.planned}%"></div></div><span class="cell-mono" style="font-size:10px;">${w.planned}%</span></td>
        <td style="min-width:100px;"><div class="progress-track"><div class="progress-fill ${variance<0?'red':'green'}" style="width:${w.actual}%"></div></div><span class="cell-mono" style="font-size:10px;">${w.actual}%</span></td>
        <td class="cell-mono" style="color:${variance<0?'var(--red)':'var(--green)'}">${variance>0?'+':''}${variance}%</td>
        <td>${stBadge(w.status)}</td>
        <td style="white-space:nowrap;"><button class="btn btn-sm" onclick="openWprogressForm('${w.id}')">Edit</button> <button class="btn btn-sm btn-ghost-danger" onclick="deleteWprogress('${w.id}')">Delete</button></td>
      </tr>`;
    }).join('')}</tbody>`;
  s.appendChild(wrap);
  els.content.appendChild(s);
}
function openWprogressForm(id){
  const existing = id ? state.wprogress.find(w=>String(w.id)===String(id)) : null;
  openModal(existing?'Edit Progress Entry':'Add Progress Entry', [
    {k:'project', label:'Project', type:'select', req:true, options:projectNameOptions()},
    {k:'activity', label:'Activity', type:'text', req:true},
    {k:'milestone', label:'Current Milestone', type:'text'},
    {k:'planned', label:'Planned Progress (%)', type:'number', min:0, max:100, req:true},
    {k:'actual', label:'Actual Progress (%)', type:'number', min:0, max:100, req:true},
    {k:'status', label:'Status', type:'select', req:true, options:['On Track','Delayed']},
  ], data=>{
    const rec = Object.assign({}, data, {planned:Number(data.planned), actual:Number(data.actual)});
    if(existing){ Object.assign(existing, rec); toast('Progress entry updated'); }
    else { state.wprogress.unshift(Object.assign({id:uid()}, rec)); toast('Progress entry added'); }
    render();
  }, {initial: existing||{}});
}
function deleteWprogress(id){
  confirmModal('Delete this progress entry?', ()=>{
    state.wprogress = state.wprogress.filter(w=>String(w.id)!==String(id));
    toast('Progress entry deleted');
    render();
  });
}
</script>
<script>
/* =======================================================
   PURCHASE MANAGEMENT — workflow visual wrapper
======================================================= */
function renderPurchases(){
  const s = sheet('Management', 'Purchase Management', `${state.purchases.length} purchase(s)`);

/* =======================================================
   ROUTER / NAV / INIT
======================================================= */
const RENDERERS = {
  dashboard: renderDashboard,
  users: ()=>genericModule(MODULE_CONFIG.users),
  projects: renderProjects,
  team: ()=>genericModule(MODULE_CONFIG.team),
  payroll: ()=>genericModule(MODULE_CONFIG.payroll),
  safety: ()=>genericModule(MODULE_CONFIG.incidents),
  purchases: renderPurchases,
  boq: renderBoq,
  inventory: ()=>genericModule(MODULE_CONFIG.materials),
  windup: renderWindup,
  tasks: renderTasks,
  attendance: ()=>genericModule(MODULE_CONFIG.attendance),
  equipment: ()=>genericModule(MODULE_CONFIG.equipment),
  diary: renderDiary,
  wprogress: renderWprogress,
  sites: ()=>genericModule(MODULE_CONFIG.sites),
  labour: ()=>genericModule(MODULE_CONFIG.labour),
  clients: ()=>genericModule(MODULE_CONFIG.clients),
  contractors: ()=>genericModule(MODULE_CONFIG.contractors),
  billing: ()=>genericModule(MODULE_CONFIG.invoices),
  payments: ()=>genericModule(MODULE_CONFIG.payments),
};

const TITLES = {
  dashboard:['Dashboard','Portfolio Overview'],
  users:['User & Role Management','Roles · Permissions · Access'],
  projects:['Project Management','Timelines · Budgets · Milestones'],
  team:['Project Team Management','Assignments · Designations'],
  payroll:['Payroll Records','Salary · Overtime · Deductions'],
  safety:['Safety & Incident Management','Incidents · Severity · Corrective Action'],
  purchases:['Purchase Management','Suppliers · Materials · Procurement'],
  boq:['Estimate / BOQ','Cost Estimation · Bill of Quantities'],
  inventory:['Inventory Management','Stock · Reorder Alerts'],
  windup:['Wind Up Report','Project Closing Summary'],
  tasks:['Task Management','Assignment · Priority · Status'],
  attendance:['Attendance & Time Cards','Check-in · Check-out · Hours'],
  equipment:['Equipment & Asset Management','Assignment · Utilization · Maintenance'],
  diary:['Daily Site Diary','Weather · Work · Manpower · Materials'],
  wprogress:['Work Progress Management','Planned vs Actual'],
  sites:['Site Management','Locations · Teams · Live Status'],
  labour:['Labour Management','Attendance · Deployment'],
  clients:['Client Management','Relationships · Contacts · Contracts'],
  contractors:['Contractor Management','Work Packages · Payment Status'],
  billing:['Billing','Invoices · Line Items'],
  payments:['Payments','Receipts · Disbursements'],
};

const NAV_TO_STATE = {
  users:'users', projects:'projects', team:'team', payroll:'payroll', safety:'incidents',
  purchases:'purchases', boq:'estimates', inventory:'materials', windup:'windups', tasks:'tasks',
  attendance:'attendance', equipment:'equipment', diary:'diary', wprogress:'wprogress',
  sites:'sites', labour:'labour', clients:'clients', contractors:'contractors',
  billing:'invoices', payments:'payments',
};

const QUICK_ADD = {
  users: ()=>openItemForm(MODULE_CONFIG.users, null),
  projects: ()=>openProjectForm(),
  team: ()=>openItemForm(MODULE_CONFIG.team, null),
  payroll: ()=>openItemForm(MODULE_CONFIG.payroll, null),
  safety: ()=>openItemForm(MODULE_CONFIG.incidents, null),
  purchases: ()=>openItemForm(MODULE_CONFIG.purchases, null),
  boq: openEstimateForm,
  inventory: ()=>openItemForm(MODULE_CONFIG.materials, null),
  windup: ()=>openWindupForm(),
  tasks: ()=>openTaskForm(null),
  attendance: ()=>openItemForm(MODULE_CONFIG.attendance, null),
  equipment: ()=>openItemForm(MODULE_CONFIG.equipment, null),
  diary: ()=>openDiaryForm(null),
  wprogress: ()=>openWprogressForm(null),
  sites: ()=>openItemForm(MODULE_CONFIG.sites, null),
  labour: ()=>openItemForm(MODULE_CONFIG.labour, null),
  clients: ()=>openItemForm(MODULE_CONFIG.clients, null),
  contractors: ()=>openItemForm(MODULE_CONFIG.contractors, null),
  billing: ()=>openItemForm(MODULE_CONFIG.invoices, null),
  payments: ()=>openItemForm(MODULE_CONFIG.payments, null),
};

function updateCounts(){
  Object.entries(NAV_TO_STATE).forEach(([nav,key])=>{
    const el = document.getElementById('nc-'+nav);
    if(el) el.textContent = state[key].length;
  });
}

function render(){
  updateCounts();
  els.content.innerHTML = '';
  (RENDERERS[currentView] || renderDashboard)();
}

function showView(view){
  currentView = view;
  if(view !== 'projects') projectDetailId = null;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.getElementById('topbar-title').textContent = TITLES[view][0];
  document.getElementById('topbar-crumb').textContent = TITLES[view][1];
  document.getElementById('sidebar').classList.remove('open');
  render();
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});
document.getElementById('btn-refresh-ai').addEventListener('click', ()=>{
  toast('AI predictions recalculated');
  render();
});
document.getElementById('btn-quick-add').addEventListener('click', ()=>{
  (QUICK_ADD[currentView] || openProjectForm)();
});
document.getElementById('sidebar-toggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* =======================================================
   DEMO AUTH (local only — any credentials work)
======================================================= */
const loginScreen = document.getElementById('login-screen');
const appRoot = document.getElementById('app');
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const userRoleChip = document.getElementById('user-role-chip');
const logoutButton = document.getElementById('btn-logout');

function showLogin(){ loginScreen.style.display='flex'; appRoot.style.display='none'; }
function showApp(){ loginScreen.style.display='none'; appRoot.style.display='flex'; }

logoutButton.addEventListener('click', ()=>{
  sessionStorage.removeItem('demo_profile');
  showLogin();
  loginForm.reset();
});

loginForm.addEventListener('submit', e=>{
  e.preventDefault();
  loginError.style.display='none';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const role = document.getElementById('login-role').value;
  if(!username || !password){
    loginError.textContent = 'Please enter a username and password.';
    loginError.style.display='block';
    return;
  }
  const profile = {username, role};
  sessionStorage.setItem('demo_profile', JSON.stringify(profile));
  userRoleChip.textContent = `${username} · ${role}`;
  showApp();
  showView('dashboard');
});

/* initial auth state */
(function initAuth(){
  const saved = sessionStorage.getItem('demo_profile');
  if(saved){
    const profile = JSON.parse(saved);
    userRoleChip.textContent = `${profile.username} · ${profile.role}`;
    showApp();
    showView('dashboard');
  } else {
    showLogin();
  }
})();
</script>
